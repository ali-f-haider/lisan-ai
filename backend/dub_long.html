<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lisan AI — Dub Long Video</title>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="stylesheet" href="/styles.css">
<style>
  .ld-wrap { max-width: 1100px; margin: 0 auto; padding: 0 12px 60px; }
  .ld-drop {
    border: 2px dashed var(--border); border-radius: 12px; padding: 34px 16px; text-align: center;
    cursor: pointer; transition: border-color .2s, background .2s; margin-top: 12px;
  }
  .ld-drop:hover, .ld-drop.over { border-color: var(--accent); background: var(--muted-surface); }
  .ld-drop strong { display: block; font-size: 16px; margin-bottom: 6px; }
  .ld-spkask { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 14px; }
  .ld-spkask label { margin: 0; }
  .ld-spkask input { width: 80px; }
  .ld-projfields { margin-top: 14px; display: grid; gap: 10px; }
  .ld-projfields label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 4px; }
  .ld-projfields input, .ld-projfields textarea { width: 100%; box-sizing: border-box; }
  .ld-projfields textarea { min-height: 62px; resize: vertical; font: inherit; }
  .ld-projhead { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
  .ld-projhead .pname { font-size: 17px; font-weight: 700; word-break: break-word; }
  .ld-projhead .pdesc { color: var(--text-muted); font-size: 13px; margin-top: 2px; white-space: pre-wrap; word-break: break-word; }
  .ld-unheard { grid-column: 1 / -1; background: rgba(217,119,6,.12); border-left: 3px solid var(--warning); padding: 7px 12px; border-radius: 8px; font-size: 12.5px; line-height: 1.5; }
  html[dir="rtl"] .ld-unheard { border-left: none; border-right: 3px solid var(--warning); }
  .ld-pl-overlay { position: fixed; inset: 0; background: rgba(15,23,42,.6); z-index: 99990; display: flex; align-items: flex-start; justify-content: center; padding: 16px; overflow-y: auto; }
  .ld-pl { background: var(--card); color: var(--text); border-radius: 14px; width: 100%; max-width: 760px; padding: 18px 20px 20px; box-shadow: 0 20px 60px rgba(0,0,0,.35); margin: auto; }
  .ld-pl h4 { margin: 0 0 4px; font-size: 16px; }
  .ld-pl video { width: 100%; max-height: 34vh; background: #000; border-radius: 10px; display: block; margin-top: 10px; }
  .ld-pl video.audio { height: 0; max-height: 0; margin: 0; }
  .ld-pl-time { font-size: 34px; font-weight: 700; text-align: center; margin: 10px 0 2px; font-variant-numeric: tabular-nums; letter-spacing: .5px; direction: ltr; }
  .ld-pl-time small { font-size: 15px; font-weight: 500; color: var(--text-muted); }
  .ld-pl input[type=range] { width: 100%; margin: 6px 0; direction: ltr; }
  .ld-pl-row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; align-items: center; margin: 8px 0; }
  .ld-pl-row button { padding: 6px 11px; font-size: 13px; }
  .ld-pl-row label { white-space: nowrap; font-size: 12.5px; color: var(--text-muted); display: inline-flex; gap: 5px; align-items: center; }
  .ld-pl-row select { padding: 4px 6px; font-size: 13px; }
  .ld-pl-marks { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; }
  .ld-pl-mark { border: 1px solid var(--border); border-radius: 10px; padding: 10px; }
  .ld-pl-mark b { display: block; font-size: 13px; margin-bottom: 6px; }
  .ld-pl-mark input { width: 100%; box-sizing: border-box; text-align: center; font-size: 18px; font-variant-numeric: tabular-nums; direction: ltr; margin-bottom: 6px; }
  .ld-pl-mark .btns { display: flex; gap: 6px; flex-wrap: wrap; }
  .ld-pl-mark .btns button { padding: 5px 10px; font-size: 12.5px; flex: 1; }
  .ld-pl-info { text-align: center; font-size: 13px; color: var(--text-muted); margin: 8px 0 2px; }
  .ld-pl-err { color: var(--error); font-size: 13px; text-align: center; margin: 6px 0; }
  .ld-pl-foot { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; flex-wrap: wrap; position: sticky; bottom: 0; background: var(--card); padding-top: 10px; }
  .ld-pl-keys { font-size: 11.5px; color: var(--text-muted); text-align: center; margin-top: 6px; }
  @media (max-width: 560px) { .ld-pl-marks { grid-template-columns: 1fr; } .ld-pl-time { font-size: 28px; } }
  .ld-lipask { margin-top: 16px; }
  .ld-subask { margin-top: 16px; }
  .ld-subrow { margin: 12px 0 4px; }
  body a.ld-dl, body.dark a.ld-dl, body.ui-new a.ld-dl, body.dark.ui-new a.ld-dl { color: #fff; }
  .ld-gloss, .ld-extra { border: 1px solid var(--border); border-radius: 10px; padding: 10px 16px; margin: 10px 0 14px; }
  .ld-gloss summary { cursor: pointer; }
  .ld-gloss textarea { width: 100%; box-sizing: border-box; min-height: 96px; resize: vertical; font: inherit; line-height: 1.5; }
  .ld-extra a.ld-dl { margin: 4px 8px 4px 0; padding: 9px 18px; }
  html[dir="rtl"] .ld-extra a.ld-dl { margin: 4px 0 4px 8px; }
  .ld-lipres { margin: 10px 0 4px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 14px; }
  .ld-lipres select { padding: 6px 8px; font-size: 14px; width: auto; max-width: 100%; }
  .ld-lipres.hidden { display: none; }
  .ld-room { margin: 12px 0 2px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 14px; }
  .ld-room select { padding: 6px 8px; font-size: 14px; width: auto; max-width: 100%; }
  .ld-lipask .ld-radio { display: flex; gap: 10px; align-items: flex-start; margin: 8px 0; cursor: pointer; font-size: 14px; line-height: 1.5; }
  .ld-lipask .ld-radio input { width: auto; margin-top: 4px; flex: none; }
  .ld-lipask .ld-radio.off { opacity: .55; cursor: not-allowed; }
  .ld-table { width: 100%; border-collapse: collapse; margin: 10px 0; }
  .ld-table td { padding: 9px 6px; border-bottom: 1px solid var(--border); font-size: 14px; vertical-align: top; }
  .ld-table td.num { text-align: end; font-weight: 700; white-space: nowrap; }
  .ld-table tr.total td { border-bottom: none; font-size: 16px; font-weight: 800; color: var(--primary-fg); padding-top: 14px; }
  .ld-table .sub { display: block; font-size: 12px; color: var(--text-muted); font-weight: 400; margin-top: 2px; }
  .ld-row-btns { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; align-items: center; }
  .ld-err { color: var(--error); font-size: 14px; margin-top: 10px; font-weight: 600; }
  .ld-warn { background: rgba(217,119,6,.12); border-left: 3px solid var(--warning); padding: 8px 12px; border-radius: 8px; font-size: 13px; margin: 8px 0; }
  .ld-status { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 12px; background: var(--muted-surface); color: var(--text-muted); }
  .ld-status.ok { color: var(--success); }
  .ld-status.bad { color: var(--error); }
  .ld-list-item { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; border-top: 1px solid var(--border); padding: 12px 0; }
  .ld-list-item:first-child { border-top: none; }
  .ld-list-name { font-weight: 700; word-break: break-all; }
  .ld-list-meta { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .btn-danger {
    padding: 10px 20px; background: var(--card); color: var(--error); border: 1px solid #fecaca;
    border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .btn-danger:hover { background: rgba(248,113,113,.12); transform: none; }
  body.dark .btn-danger { border-color: #7f1d1d; }
  .btn-plain { background: var(--logout-bg); color: var(--text-muted); border: 1px solid var(--border); }
  .btn-plain:hover { background: var(--logout-hover-bg); }
  a.ld-dl { display: inline-block; padding: 12px 24px; background: var(--success); color: #fff; border-radius: 8px; font-weight: 700; text-decoration: none; }

  .ld-terms { border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; margin: 12px 0; background: var(--muted-surface); }
  .ld-terms h4 { margin: 0 0 6px; font-size: 14px; }
  .ld-terms ul { margin: 6px 18px; padding: 0; font-size: 13px; line-height: 1.6; }
  .ld-agree { display: flex; gap: 10px; align-items: flex-start; margin-top: 10px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .ld-agree input { width: auto; margin-top: 3px; }
  .ld-times { font-size: 14px; margin: 8px 0; }
  .ld-upsell { text-align: center; padding: 10px 0; }

  /* Editor */
  .ld-edhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .ld-saved { font-size: 13px; color: var(--text-muted); }
  .ld-spkpanel { border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; margin: 10px 0 16px; }
  .ld-spkpanel h4 { margin: 0 0 4px; font-size: 15px; }
  .ld-spkrow { display: flex; gap: 10px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
  .ld-spkrow input { max-width: 260px; }
  .ld-spkrow .cnt { font-size: 12px; color: var(--text-muted); min-width: 70px; }
  .ld-seg { display: grid; grid-template-columns: 190px 1fr 1fr; gap: 10px; padding: 12px 0; border-top: 1px solid var(--border); align-items: start; }
  .ld-seg:first-child { border-top: none; }
  .ld-time { font-size: 12px; color: var(--text-muted); line-height: 1.5; }
  .ld-time b { display: block; color: var(--text); font-size: 13px; }
  .ld-time select { margin-top: 6px; padding: 6px 8px; font-size: 13px; }
  .ld-tf { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; font-size: 12px; }
  .ld-tf span { width: 30px; }
  .ld-tf input.ld-t { width: 92px; padding: 5px 6px; font-size: 13px; text-align: center; font-variant-numeric: tabular-nums; }
  .ld-terr { color: var(--error); font-size: 11px; margin: 2px 0 4px; line-height: 1.4; }
  .ld-lbtns { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .ld-lbtns button { padding: 4px 10px; font-size: 12px; }
  .ld-seg textarea { min-height: 54px; width: 100%; resize: vertical; line-height: 1.5; }
  .ld-seg textarea.missing { border-color: var(--error); }
  .ld-arwrap { display: flex; flex-direction: column; gap: 6px; }
  .ld-arwrap textarea { direction: rtl; text-align: right; font-size: 16px; }
  .ld-arfoot { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .ld-arfoot button { padding: 5px 12px; font-size: 12px; }
  .ld-arfoot .ld-emosel { padding: 4px 6px; font-size: 12px; max-width: 150px; min-width: 0; flex: 0 1 auto; width: auto; }
  .ld-cnt { font-size: 11px; color: var(--text-muted); }
  .ld-arfoot .ld-foot-r { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; min-width: 0; }
  .ld-emobtn { display: inline-flex; align-items: center; gap: 6px; max-width: 210px; padding: 5px 10px; font-size: 12px; cursor: pointer; font-family: inherit; border-radius: 8px; }
  .ld-emobtn span.t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .ld-emopanel { position: fixed; z-index: 400; width: 240px; max-height: 300px; overflow-y: auto; background: var(--card); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.35); padding: 6px; }
  .ld-emopanel .hint { font-size: 11px; color: var(--text-muted); padding: 4px 8px 6px; border-bottom: 1px solid var(--border); margin-bottom: 4px; }
  .ld-emopanel .hint.warn { color: var(--warning); }
  .ld-emopanel label { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 6px; font-size: 13px; cursor: pointer; margin: 0; }
  .ld-emopanel label:hover { background: var(--muted-surface); }
  .ld-emopanel label.off { opacity: .45; cursor: not-allowed; }
  .ld-emopanel input { width: auto; margin: 0; flex: none; }
  .ld-colhead { display: grid; grid-template-columns: 190px 1fr 1fr; gap: 10px; font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: .03em; padding-bottom: 6px; border-bottom: 2px solid var(--border); }
  @media (max-width: 720px) {
    .ld-seg, .ld-colhead { grid-template-columns: 1fr; }
    .ld-colhead { display: none; }
    .card { margin: 10px 0; padding: 18px; }
  }
  html[dir="rtl"] .ld-wrap { direction: rtl; }
  html[dir="rtl"] .note { border-left: none; border-right: 3px solid var(--accent); }
  html[dir="rtl"] .ld-warn { border-left: none; border-right: 3px solid var(--warning); }
  html[dir="rtl"] .ld-seg textarea.en { direction: ltr; text-align: left; }
  html[dir="rtl"] #userBar { direction: rtl; }
</style>
</head>
<body>
<div id="userBar">
  <div class="brand-row" style="display:flex;align-items:center;gap:10px;">
    <img src="/logo.png" style="height:30px;" alt="">
    <strong id="pageTitle" style="color:#1a237e;">Lisan AI — Dub Long Video</strong>
  </div>
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
    <button id="langBtn" class="btn-logout" title="Language" onclick="window._toggleLang()">العربية</button>
    <button id="darkModeBtn" class="btn-logout" title="Toggle dark mode" onclick="window._toggleDarkMode()">🌙</button>
    <span class="credits-badge" style="display:inline-block;">💰 <span id="creditsNum">–</span> <span id="creditsWord">credits</span></span>
    <button id="backBtn" class="btn-logout" onclick="location.href='/app'">← Back to App</button>
    <button id="logoutBtn" class="btn-logout" onclick="fetch('/api/logout',{method:'POST'}).then(function(){location.href='/login'})">Log Out</button>
  </div>
</div>

<div class="ld-wrap">

  <div class="card" id="introCard">
    <h3 id="introHeading">🎞️ Dub Long Video</h3>
    <p id="introText" class="note"></p>
    <ol id="introSteps" style="margin:10px 22px;line-height:1.7;font-size:14px;"></ol>
  </div>

  <div class="card hidden" id="upsellCard">
    <h3 id="upsellHeading">Studio plan</h3>
    <div class="ld-upsell">
      <p id="upsellText" style="margin-bottom:14px;"></p>
      <a id="upsellBtn" class="ld-dl" href="/pricing"></a>
    </div>
  </div>

  <div class="card" id="uploadCard">
    <h3 id="uploadHeading">1. Start a new dubbing project</h3>
    <div class="ld-projfields">
      <div><label for="projName" id="projNameLabel">Project name</label><input type="text" id="projName" maxlength="80" autocomplete="off"></div>
      <div><label for="projDesc" id="projDescLabel">Description (optional)</label><textarea id="projDesc" maxlength="500"></textarea></div>
    </div>
    <div class="ld-spkask">
      <label for="spkCount" id="spkAskLabel">How many people speak in this video?</label>
      <input type="number" id="spkCount" min="1" max="8" value="2">
    </div>
    <p class="note" id="spkAskNote"></p>
    <div class="ld-lipask" id="lipAsk">
      <strong id="lipAskLabel"></strong>
      <label class="ld-radio"><input type="radio" name="lipsync" id="lipNo" value="0" checked><span id="lipNoText"></span></label>
      <label class="ld-radio" id="lipYesWrap"><input type="radio" name="lipsync" id="lipYes" value="1"><span id="lipYesText"></span></label>
      <p class="note" id="lipAskNote"></p>
      <div class="ld-lipres hidden" id="lipResWrap"><label for="lipRes" id="lipResLabel"></label><select id="lipRes"></select></div>
      <p class="note hidden" id="lipResNote"></p>
    </div>
    <div class="ld-subask" id="subAsk">
      <strong id="subAskLabel"></strong>
      <p class="note" id="subAskNote"></p>
      <div class="ld-row-btns" style="margin:0 0 6px;"><button type="button" class="btn-plain" id="btnPickSub"></button><span id="subPicked" style="font-size:13px;"></span><button type="button" class="btn-plain hidden" id="btnClearSub"></button></div>
      <input type="file" id="subFile" accept=".srt,.vtt,.sbv,.ass,.ssa" class="hidden">
    </div>
    <div class="ld-drop" id="dropZone" tabindex="0">
      <strong id="dropTitle">Choose a video or audio file</strong>
      <span id="dropHint" class="note" style="display:inline-block;border:none;background:none;padding:0;margin:0;"></span>
    </div>
    <input type="file" id="fileInput" accept="video/*,audio/*,.mkv,.mov,.mp4,.webm,.avi,.mp3,.wav,.m4a,.aac,.flac,.ogg" class="hidden">
    <div id="uploadError" class="ld-err hidden"></div>
  </div>

  <div class="card hidden" id="jobCard">
    <h3 id="jobHeading">Your video</h3>
    <div id="jobBody"></div>
  </div>

  <div class="card hidden" id="editorCard">
    <h3 id="editorHeading">3. Review and edit</h3>
    <div id="editorBody"></div>
  </div>

  <div class="card hidden" id="listCard">
    <h3 id="listHeading">My long dubs</h3>
    <div id="listBody"></div>
  </div>

</div>

<script src="/dialogs.js"></script>
<script>
// ---- Dark mode (same key + logic as account.html) ----
(function () {
  function apply(on) {
    try {
      document.body.classList.toggle("dark", !!on);
      localStorage.setItem("lisan_dark_mode", on ? "1" : "0");
      var db = document.getElementById("darkModeBtn");
      if (db) db.textContent = on ? "☀️" : "🌙";
    } catch (e) {}
  }
  window._toggleDarkMode = function () { apply(!document.body.classList.contains("dark")); };
  var saved;
  try { saved = localStorage.getItem("lisan_dark_mode"); } catch (e) { saved = null; }
  apply(saved === null || saved === "1");        // dark unless the person chose light
})();

var LANG = "en";
try { LANG = (localStorage.getItem("lisan_lang") === "ar") ? "ar" : "en"; } catch (e) {}
window._toggleLang = function () {
  try { localStorage.setItem("lisan_lang", LANG === "ar" ? "en" : "ar"); } catch (e) {}
  location.reload();
};

var T = {
  en: {
    title: "Lisan AI — Dub Long Video", credits: "credits", back: "← Back to App", logout: "Log Out",
    introHeading: "🎞️ Dub Long Video",
    introText: function (maxMin) {
      return "For videos longer than the normal 15-second limit — up to " + maxMin + " minutes. We work on your video in the background, one small piece at a time, so you can close this page and we'll email you when your dubbed file is ready.";
    },
    introSteps: [
      "Name your project, upload your video and tell us how many people speak. You pay a small fee to get a price and time estimate for the whole job — it counts toward the total.",

      "You review the text, name the speakers, assign each line to its speaker and edit the English and Arabic. You can save and close at any time and carry on later.",
      "You confirm the exact price. We clone each speaker's voice for this job only, dub the video on our servers and email you when it's finished."
    ],
    upsellHeading: "Studio plan feature",
    upsellText: "Dub Long Video is available with the Studio plan. Upgrade to start dubbing videos of several minutes.",
    upsellBtn: "See the Studio plan",
    uploadHeading: "1. Start a new dubbing project",
    projNameLabel: "Project name", projNamePh: "For example: Friends, season 1 episode 3",

// ---- lip-sync resolution (480p / 720p / 1080p, each with its price per second)
function lipRates() { return (cfg && cfg.lipsync && cfg.lipsync.rates) || { "480P": 20, "720P": 40, "1080P": 80 }; }
function lipResOptions(selected) {

  }).join("");
}
function wireLipRes() {
  ["lipNo", "lipYes"].forEach(function (id) { var el = $(id); if (el) el.addEventListener("change", syncLipResBox); });
}
function syncLipResBox() {

}
function changeLipRes(sel, after) {

// ------------------------------------------------------------------ jobs

function isOpen(st) { return ["done", "failed", "cancelled", "expired"].indexOf(st) < 0; }
function isWorking(st) { return ["accepted", "analyzing", "confirmed", "dubbing"].indexOf(st) >= 0; }

function loadList() {
  return api("GET", "/api/longdub").then(function (r) {
    if (!r.ok) return;
    jobs = r.data.jobs || [];
    setCredits(r.data.credits);
  });
}

function pickInitial() {
  var stored = null;
  try { stored = localStorage.getItem(LS_KEY); } catch (e) {}
  var j = null;
  if (stored) j = jobs.filter(function (x) { return x.id === stored; })[0] || null;
  if (!j) j = jobs.filter(function (x) { return isOpen(x.status); })[0] || null;
  return j;
}

function selectJob(j) {
  stopPoll();
  cur = j || null;
  segs = []; spk = []; dirty = {}; pricePreview = null; tashNote = ""; lastErr = "";
  if (localMedia && (!cur || localMedia.jobId !== cur.id)) { try { URL.revokeObjectURL(localMedia.url); } catch (e) {} localMedia = null; }
  try { if (cur) localStorage.setItem(LS_KEY, cur.id); else localStorage.removeItem(LS_KEY); } catch (e) {}
  render();
  if (cur && cur.status === "editing") loadSegments();
  if (cur && isWorking(cur.status)) startPoll();
}

function refreshCurrent() {
  if (!cur) return Promise.resolve();
  var id = cur.id;
  return api("GET", "/api/longdub/" + id).then(function (r) {
    if (!cur || cur.id !== id) return;
    if (r.status === 404) { selectJob(null); return loadList().then(renderList); }
    if (!r.ok) return;
    var was = cur.status;
    cur = r.data;
    if (cur.status !== was) {
      if (!isWorking(cur.status)) stopPoll();
      render();
      if (cur.status === "editing") loadSegments();
      loadList().then(renderList);
    } else {
      renderJob();
    }
  });
}

document.addEventListener("visibilitychange", function () {
  if (!document.hidden && cur && isWorking(cur.status)) refreshCurrent();
});

function startPoll() { stopPoll(); pollTimer = setInterval(refreshCurrent, 4000); }
function stopPoll() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }

// ---------------------------------------------------------------- render

function render() {
  var st = cur ? cur.status : null;
  var studio = !cfg || cfg.studio;
  $("upsellCard").classList.toggle("hidden", studio);
  $("uploadCard").classList.toggle("hidden", !studio || (!!cur && (isOpen(st) || st === "done")));
  $("jobCard").classList.toggle("hidden", !cur || st === "editing");
  $("editorCard").classList.toggle("hidden", !cur || st !== "editing");
  renderJob();
  renderEditor();
  renderList();
}

function projName(j) { return (j && (j.name || j.filename)) || ""; }
function isSaved(j) { return !!j && j.status === "editing" && j.media_present === false; }
function badgeFor(j) {
  if (isSaved(j) && !j.reattaching) return '<span class="ld-status">' + esc(T.stSaved) + "</span>";
  return statusBadge(j.status);
}

function statusBadge(st) {
  var cls = (st === "done" || st === "editing") ? "ok" : (st === "failed" || st === "cancelled" || st === "expired") ? "bad" : "";
  return '<span class="ld-status ' + cls + '">' + esc(T.st[st] || st) + "</span>";
}

var roOpen = {};       // job id -> the read-only lines of a finished project are shown
var roCache = {};
function roHtml(j) {

         "<td dir='ltr' style='vertical-align:top;'>" + esc(r.text || "") + "</td>" +

function renderJob() {
  if (!cur) { $("jobBody").innerHTML = ""; return; }
  if (cur.status === "editing") { renderReattach(); return; }
  var j = cur, h = "";
  var heading = T.jobHeading;
  if (j.status === "estimated") heading = T.estHeading;
  else if (j.restoring) heading = T.restoringHeading;
  else if (j.status === "accepted" || j.status === "analyzing") heading = T.analyzingHeading;
  else if (j.status === "confirmed" || j.status === "dubbing") heading = T.dubbingHeading;
  else if (j.status === "failed") heading = T.failedHeading;
  else if (j.status === "done") heading = T.doneHeading;
  $("jobHeading").textContent = heading;
  var name = '<p style="margin:0 0 6px;"><strong style="word-break:break-all;">' + esc(projName(j)) + "</strong> " + statusBadge(j.status) + "</p>";

  if (j.status === "uploading") {

    h += name;
    h += '<div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div>';
    h += "<p class='note'>" + esc(uploading ? T.uploadingPct(pct, j.received_count || 0, j.total_chunks || 0) : T.uploadPaused) + "</p>";

  } else if (j.status === "estimated") {
    h += name + renderEstimate(j);
  } else if (isWorking(j.status)) {
    h += name;
    h += '<div class="progress-bar"><div class="progress-fill" style="width:' + (j.percent || 0) + '%"></div></div>';
    var label = (j.stage === "queued" || !j.stage) ? T.queued : (T.stage[j.stage] || j.message || "");
    var extra = "";
    if (j.message && (j.stage === "transcribe" || j.stage === "separate" || j.stage === "translate" || j.stage === "speak" || j.stage === "mix" || j.stage === "lipsync")) {
      var m = String(j.message).match(/\(([^)]*)\)/); if (m) extra = " (" + m[1].replace(/part|lines|line|clip/g, "").replace(/\s+/g, " ").trim() + ")";

    else h += "<p class='note'>" + esc(j.stage === "lipsync" ? T.lipNote : ((j.status === "confirmed" || j.status === "dubbing") ? T.dubbingNote : (j.restoring ? T.restoringNote : T.analyzingNote))) + "</p>";
  } else if (j.status === "failed") {

  } else if (j.status === "done") {
    var r = j.result || {};

      if (r.failed_lines) h += "<div class='ld-warn'>" + esc(T.doneWarn(r.failed_lines)) + "</div>";
      var at = function (a) { return a.map(fmtTime).join("، "); };
      if (r.rephrased && r.rephrased.length) {
        h += "<div class='ld-warn'>" + esc(T.doneRephrased(r.n_rephrased || r.rephrased.length, at(r.rephrased.map(function (x) { return x.t; })), r.rephrase_refund || 0)) + "</div>";
        h += "<details style='margin:6px 0 10px;'><summary style='cursor:pointer;font-size:13px;'>" + esc(T.showChanges) + "</summary>" +
          r.rephrased.map(function (x) {
            return "<div style='border-top:1px solid var(--border);padding:8px 0;font-size:13px;'><b>" + esc(fmtTime(x.t)) + "</b>" +
              "<div style='color:var(--text-muted);'>" + esc(T.chBefore) + "</div><div dir='rtl' style='font-size:15px;'>" + esc(x.before) + "</div>" +
              "<div style='color:var(--text-muted);margin-top:4px;'>" + esc(T.chAfter) + "</div><div dir='rtl' style='font-size:15px;'>" + esc(x.after) + "</div></div>";
          }).join("") + "</details>";
      }
      if (r.background) h += "<div class='ld-warn'>" + esc(T.doneBg(r.background.state, r.background.failed_parts, r.background.parts)) + "</div>";

      if (r.timing && r.timing.n_fast) h += "<div class='ld-warn'>" + esc(T.doneFast(r.timing.n_fast, at(r.timing.fast) + (r.timing.n_fast > r.timing.fast.length ? " …" : ""))) + "</div>";
      if (r.lipsync) h += "<p class='note'>" + esc(T.doneLip(r.lipsync.synced, r.lipsync.clips)) + "</p>";
      if (r.watermark && r.kind === "video") h += "<div class='ld-warn'>" + esc(T.wmNote) + ' <a href="/pricing">' + esc(T.buyCredits) + "</a></div>";
      h += '<div class="ld-row-btns"><a class="ld-dl" href="/api/longdub/' + esc(j.id) + '/download">' + esc(T.download) + "</a></div>";

    }

  if (lastErr) h += '<div class="ld-err">' + esc(lastErr) + "</div>";
  $("jobBody").innerHTML = h;
  wireJobButtons();
  if (j.status === "done" && j.file_available) wireSubs(j, "dn");
  var sb = $("btnShowLines");
  if (sb) sb.onclick = function () {
    roOpen[j.id] = !roOpen[j.id];

function renderEstimate(j) {

  var row = function (label, sub, n) {

  if (e.times) h += "<p class='ld-times'>" + esc(T.estTimes(e.times)) + "</p>";
  h += "<p style='font-weight:600;'>" + esc(bal === null || bal === undefined ? "" : T.estBalance(bal)) + "</p>";

  if (short) h += "<p class='ld-err'>" + esc(T.notEnough(remaining, bal)) + ' <a href="/pricing" style="color:inherit;">' + esc(T.buyCredits) + "</a></p>";
  h += '<div class="ld-row-btns"><button class="green" id="btnAccept" disabled>' + esc(T.acceptBtn) + '</button><button class="btn-plain" id="btnDelete">' + esc(T.declineBtn) + "</button></div>";
  window._estShort = short;
  return h;
}

function wireJobButtons() {

// ---- subtitle download + separate tracks + glossary (see subs_export.py and the glossary part of longdub_service.py)
var tracksPref = false;      // "also save the dubbed voices and the music as separate files" (confirm step)
var glossDraft = {};         // job id -> the text typed in the glossary box (kept when the page redraws)
var glossMsg = {};           // job id -> the last message under the glossary box

function glossText(j) {

function wireGloss(j) {
  var ta = $("glossText"), sv = $("btnGlossSave"), ap = $("btnGlossApply"), st = $("glossState");
  if (!ta || !j) return;
  var det = ta.parentNode;
  if (det && det.tagName === "DETAILS") det.ontoggle = function () { glossOpen[j.id] = det.open; };
  ta.oninput = function () { glossDraft[j.id] = ta.value; };
  var say = function (m) { glossMsg[j.id] = m; if ($("glossState")) $("glossState").textContent = m; };
  var save = function () {
    return api("PUT", "/api/longdub/" + j.id + "/glossary", { text: ta.value }).then(function (r) {
      if (!r.ok) { say(safeErr(r.data.error, T.genericErr)); return false; }
      j.glossary = r.data.glossary; if (cur && cur.id === j.id) cur.glossary = r.data.glossary;
      glossDraft[j.id] = ta.value;
      say(T.glossSaved(r.data.glossary.length, r.data.bad));
      return true;
    }).catch(function () { say(T.netErr); return false; });
  };
  if (sv) sv.onclick = function () { sv.disabled = true; save().then(function () { sv.disabled = false; }); };
  if (ap) ap.onclick = function () {
    ap.disabled = true; if (sv) sv.disabled = true; say(T.glossWorking);
    var done = function () { ap.disabled = false; if (sv) sv.disabled = false; };
    flushSave().then(save).then(function (ok) {

      });
    }).catch(function () { say(T.netErr); done(); });
  };
}
function renderEditorExtras() {

// ---- optional English subtitle file (see subs_align.py)
var pendingSub = null;     // chosen on the upload card, sent as soon as the project exists
var subTarget = "";        // "job" = the file picked is for the open project (estimate stage)
function subRow(j) {
  var s = j.subtitle;
  return '<div class="ld-subrow"><strong>' + esc(T.subAskLabel) + "</strong><p class='note'>" + esc(s ? T.subOn(s.name, s.cues) : T.subAskNote) + "</p>" +
         '<div class="ld-row-btns" style="margin:4px 0 12px;"><button class="btn-plain" id="btnSubAdd">' + esc(s ? T.subChange : T.subPick) + "</button>" +
         (s ? '<button class="btn-plain" id="btnSubDel">' + esc(T.subRemove) + "</button>" : "") + "</div></div>";
}
function looksLikeSub(t) {
  return /-->/.test(t) || /^Dialogue:/m.test(t) || /^\s*\d+:\d{2}:\d{2}\.\d+\s*,\s*\d+:\d{2}:\d{2}\.\d+/m.test(t);
}
function renderPendingSub() {
  var on = !!pendingSub;
  $("subPicked").textContent = on ? T.subPicked(pendingSub.filename) : "";
  $("btnClearSub").classList.toggle("hidden", !on);
  $("btnPickSub").textContent = on ? T.subChange : T.subPick;
}
function attachSubtitle(id, payload) {
  return api("POST", "/api/longdub/" + id + "/subtitle", payload).then(function (r) {
    if (!r.ok) { alertMsg(safeErr(r.data.error, T.genericErr)); return false; }
    if (cur && cur.id === id) cur.subtitle = r.data.subtitle || null;
    return true;
  }).catch(function () { alertMsg(T.netErr); return false; });
}
function onSubPicked(file) {
  var forJob = subTarget === "job"; subTarget = "";
  if (!file) return;
  if (!window.LisanDialog || !LisanDialog.readSubtitle) return;
  LisanDialog.readSubtitle(file).then(function (text) {
    if (!looksLikeSub(text)) { alertMsg(T.subNotSub); return; }
    var ar = (text.match(/[\u0600-\u06FF]/g) || []).length, la = (text.match(/[A-Za-z]/g) || []).length;
    if (ar > la) { alertMsg(T.subArabic); return; }
    return LisanDialog.subtitle(file, { showAdd: true }).then(function (choice) {
      if (!choice) return;
      var payload = { text: text, filename: file.name, mode: choice.mode, add_missed: choice.add_missed };
      if (forJob && cur) {
        var id = cur.id;
        return attachSubtitle(id, payload).then(function (ok) { if (ok && cur && cur.id === id) renderJob(); });
      }
      pendingSub = payload; renderPendingSub();
    });
  }).catch(function () { alertMsg(T.subReadFail); });
}
function subNoteHtml(j) {
  var s = j && j.subtitle, r = s && s.result;
  if (!r) return "";
  if (r.ok) return "<div class='ld-note-ok note'>" + esc(T.subDone(r)) + "</div>";
  return "<div class='ld-warn'>" + esc(T.subFail(r.reason)) + "</div>";
}

var redoAuto = {};     // job id -> the price of this redo was fetched automatically already
function onRedo() {
  if (!cur || cur.status !== "done") return;
  var src = cur;
  var msg = T.redoAsk(projName(src));
  var ask = (window.LisanDialog && LisanDialog.confirm) ? LisanDialog.confirm(msg, { okText: T.redoOk }) : Promise.resolve(window.confirm(msg));
  ask.then(function (yes) {
    if (!yes) return;
    var b = $("btnRedo"); if (b) { b.disabled = true; b.textContent = T.redoWorking; }
    var reset = function () { var bb = $("btnRedo"); if (bb) { bb.disabled = false; bb.textContent = T.redoBtn; } };
    api("POST", "/api/longdub/" + src.id + "/redo").then(function (r) {
      if (!r.ok) { reset(); alertMsg(safeErr(r.data.error, T.redoFail)); return; }
      var nj = r.data;
      jobs = jobs.filter(function (x) { return x.id !== nj.id; });
      jobs.unshift(nj);
      selectJob(nj);
      window.scrollTo(0, 0);
      loadList().then(renderList);
    }).catch(function () { reset(); alertMsg(T.netErr); });
  });
}

function renderReattach() {
  var box = $("reattachBox"); if (!box || !cur) return;
  if (cur.media_present !== false) { box.innerHTML = ""; return; }
  var total = cur.total_chunks || 0, got = cur.received_count || 0;
  var h = '<div class="ld-warn"><strong>' + esc(T.reattachHead) + "</strong><p style='margin:6px 0;'>" + esc(T.reattachText) + "</p>";
  if (uploading || cur.reattaching) {
    var pct = cur.percent || (total ? Math.floor(100 * got / total) : 0);
    h += '<div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div>';
    if (uploading) h += "<p class='note'>" + esc(total && got >= total ? T.finishing : T.reattachUp(pct)) + "</p>";
    else h += "<p class='note'>" + esc(T.reattachPaused) + '</p><div class="ld-row-btns"><button id="btnReattach">' + esc(T.reattachResume) + "</button></div>";
  } else {
    h += '<div class="ld-row-btns"><button id="btnReattach">' + esc(T.reattachBtn) + "</button></div>";
  }
  if (lastErr) h += '<p class="ld-err">' + esc(lastErr) + "</p>";
  h += "</div>";
  box.innerHTML = h;
  var b = $("btnReattach");
  if (b) b.onclick = function () { lastErr = ""; $("fileInput").dataset.resume = ""; $("fileInput").dataset.reattach = "1"; $("fileInput").click(); };
}

function handleReattach(file) {
  lastErr = "";
  if (!cur || file.size !== cur.size) { lastErr = T.wrongFileProj; renderReattach(); return; }
  if (cur.reattaching) { continueUpload(cur, file); return; }
  api("POST", "/api/longdub/" + cur.id + "/reattach", { filename: file.name, size: file.size }).then(function (r) {
    if (!r.ok) { lastErr = safeErr(r.data.error, T.genericErr); renderReattach(); return; }
    cur = r.data;
    renderReattach();
    continueUpload(cur, file);
  }).catch(function () { lastErr = T.netErr; renderReattach(); });
}

function flushAll() {
  return flushSave().then(function () {
    if (!Object.keys(dirty).length) return true;
    return sleep(700).then(function () { return flushSave(); }).then(function () { return !Object.keys(dirty).length; });
  });
}

// Switching to another project (or to a new one): unsaved typing is saved first, never dropped.
function switchTo(j) {
  if (!cur || cur.status !== "editing") { selectJob(j); return; }
  flushAll().then(function (okSaved) {
    if (!okSaved) { alertMsg(T.saveFailed); return; }
    return saveSpeakersIfPending().then(function () { selectJob(j); });
  });
}

function saveAndClose() {
  if (!cur) return;
  var id = cur.id, saved = cur.media_present === false;
  var btn = $("btnSaveClose"); if (btn) btn.disabled = true;
  if (uploading && saved) { alertMsg(T.reattachPaused); if (btn) btn.disabled = false; return; }
  flushAll().then(function (okSaved) {
    if (!okSaved) return { ok: false, data: { error: T.saveFailed } };
    return saveSpeakersIfPending();
  }).then(function (r0) {
    if (r0 && r0.ok === false) return r0;
    if (saved) return { ok: true, data: null };
    return api("POST", "/api/longdub/" + id + "/park");
  }).then(function (r) {
    if (!r.ok) { if (btn) btn.disabled = false; alertMsg(safeErr(r.data && r.data.error, T.genericErr)); return; }
    selectJob(null);
    loadList().then(renderList);
    if (!saved) alertMsg(T.savedMsg);
  }).catch(function () { if (btn) btn.disabled = false; alertMsg(T.netErr); });
}

// ---------------------------------------------------------------- upload

function showUploadError(msg) {
  var el = $("uploadError");
  el.textContent = msg || "";
  el.classList.toggle("hidden", !msg);
}

function nameOk() {
  if ($("projName").value.trim()) return true;
  showUploadError(T.projNameNeeded);
  try { $("projName").focus(); } catch (e) {}
  return false;
}

function onFilePicked(file) {
  showUploadError("");
  lastErr = "";
  if (!file) return;
  var resume = $("fileInput").dataset.resume === "1";
  var reattach = $("fileInput").dataset.reattach === "1";
  $("fileInput").dataset.resume = "";
  $("fileInput").dataset.reattach = "";
  $("fileInput").value = "";
  if (reattach && cur && cur.status === "editing" && cur.media_present === false) { handleReattach(file); return; }
  if (resume && cur && cur.status === "uploading") {
    if (file.name !== cur.filename || file.size !== cur.size) { lastErr = T.wrongFile; renderJob(); return; }
    continueUpload(cur, file);
    return;
  }
  if (!nameOk()) return;
  var maxMb = cfg ? cfg.max_upload_mb : 2048;
  if (file.size > maxMb * 1048576) { showUploadError(T.tooBig(Math.round(file.size / 1048576), maxMb)); return; }
  var maxSp = cfg ? cfg.max_speakers : 8;
  var nsp = parseInt($("spkCount").value, 10);
  if (!(nsp >= 1 && nsp <= maxSp)) { showUploadError(T.spkBad(maxSp)); return; }
  var wantLip = !!($("lipYes") && $("lipYes").checked && !$("lipYes").disabled);
  if (wantLip && /\.(mp3|wav|m4a|aac|flac|ogg)$/i.test(file.name)) { showUploadError(T.lipAudio); return; }
  api("POST", "/api/longdub/init", { filename: file.name, size: file.size, speakers: nsp, lipsync: wantLip, lip_res: wantLip ? ($("lipRes").value || "720P") : "",
                                        name: $("projName").value.trim(), description: $("projDesc").value.trim() }).then(function (r) {
    if (!r.ok) { showUploadError(r.data.storage_full ? storageMsg(r.data) : safeErr(r.data.error, T.genericErr)); return; }
    cur = r.data; jobs.unshift(cur);
    $("projName").value = ""; $("projDesc").value = "";
    try { localStorage.setItem(LS_KEY, cur.id); } catch (e) {}
    render();
    var sub = pendingSub; pendingSub = null; renderPendingSub();
    if (sub) { var jid = cur.id; attachSubtitle(jid, sub).then(function () { if (cur && cur.id === jid) renderJob(); }); }
    continueUpload(cur, file);
  }).catch(function () { showUploadError(T.netErr); });
}

async function putChunk(job, index, blob) {
  var lastMsg = "";
  for (var attempt = 1; attempt <= 6; attempt++) {
    if (uploadAbort) return { ok: false, aborted: true };
    try {
      var r = await fetch("/api/longdub/" + job.id + "/chunk?index=" + index, { method: "PUT", headers: { "Content-Type": "application/octet-stream" }, body: blob });
      if (r.status === 401) { location.href = "/login"; return { ok: false }; }
      if (r.ok) return { ok: true };
      var d = {}; try { d = await r.json(); } catch (e) {}
      lastMsg = safeErr(d.error, T.genericErr);
      if (r.status >= 400 && r.status < 500 && r.status !== 429 && r.status !== 408) return { ok: false, msg: lastMsg };
    } catch (e) { lastMsg = T.netErr; }
    await sleep(1200 * attempt);
  }
  return { ok: false, msg: lastMsg };
}

async function continueUpload(job, file) {
  if (uploading) return;
  uploading = true; uploadAbort = false; lastErr = "";
  try {
    var st = await api("GET", "/api/longdub/" + job.id);
    if (!st.ok) { lastErr = safeErr(st.data.error, T.genericErr); return; }
    var have = {}; (st.data.received || []).forEach(function (i) { have[i] = true; });
    var total = job.total_chunks, cb = cfg.chunk_bytes;
    job.received_count = Object.keys(have).length;
    for (var i = 0; i < total; i++) {
      if (have[i]) continue;
      if (uploadAbort) return;
      var blob = file.slice(i * cb, Math.min(file.size, (i + 1) * cb));
      var res = await putChunk(job, i, blob);
      if (!res.ok) { if (!res.aborted) lastErr = res.msg || T.netErr; return; }
      have[i] = true;
      job.received_count = Object.keys(have).length;
      job.percent = Math.floor(100 * job.received_count / total);
      renderJob();
    }
    uploading = false;
    await finishUpload(job);
  } finally {
    if (uploading) { uploading = false; if (cur && cur.id === job.id) renderJob(); }
  }
}

function finishUpload(job) {
  uploading = false;
  $("jobBody").insertAdjacentHTML("beforeend", "<p class='note'>" + esc(T.finishing) + "</p>");
  return api("POST", "/api/longdub/" + job.id + "/finish").then(function (r) {
    if (!r.ok) {
      lastErr = safeErr(r.data.error, T.genericErr);
      // The server removes a file it can't use (too long, no audio...).
      return loadList().then(function () {
        var still = jobs.filter(function (x) { return x.id === job.id; })[0];
        if (still) { cur = still; render(); }
        else { var m = lastErr; selectJob(null); showUploadError(m); lastErr = ""; }
      });
    }
    setCredits(r.data.credits);
    cur = r.data; lastErr = "";
    return loadList().then(function () { render(); if (cur && isWorking(cur.status)) startPoll(); });
  }).catch(function () { lastErr = T.netErr; renderJob(); });
}

// --------------------------------------------------------- accept / delete

function onAccept() {
  var b = $("btnAccept"); if (b) b.disabled = true;
  lastErr = "";
  api("POST", "/api/longdub/" + cur.id + "/accept", { agree: !!($("agreeBox") && $("agreeBox").checked) }).then(function (r) {
    if (!r.ok) { lastErr = safeErr(r.data.error, T.genericErr); renderJob(); return; }
    setCredits(r.data.credits);
    cur = r.data;
    render(); startPoll();
    loadList().then(renderList);
  }).catch(function () { lastErr = T.netErr; renderJob(); });
}

function onDelete() { deleteJob(cur); }

function deleteJob(j) {
  var msg = j.status === "editing" ? T.confirmDeleteEdit : (j.status === "estimated" ? T.confirmDeleteEst : T.confirmDeleteAny);
  var ask = (window.LisanDialog && LisanDialog.confirm) ? LisanDialog.confirm(msg, { danger: true, okText: T.deleteBtn }) : Promise.resolve(window.confirm(msg));
  ask.then(function (yes) {
    if (!yes) return;
    if (uploading && cur && cur.id === j.id) uploadAbort = true;
    api("DELETE", "/api/longdub/" + j.id).then(function (r) {
      if (!r.ok) { alertMsg(safeErr(r.data.error, T.genericErr)); return; }
      jobs = jobs.filter(function (x) { return x.id !== j.id; });
      if (cur && cur.id === j.id) selectJob(null); else renderList();
    });
  });
}

// ---------------------------------------------------------------- editor

function loadSegments() {
  var id = cur.id;
  $("editorBody").innerHTML = "<p class='note'>" + esc(T.loading) + "</p>";
  api("GET", "/api/longdub/" + id + "/segments").then(function (r) {
    if (!cur || cur.id !== id) return;
    if (!r.ok) { $("editorBody").innerHTML = "<p class='ld-err'>" + esc(safeErr(r.data.error, T.genericErr)) + "</p>"; return; }
    segs = r.data.segments || [];
    spk = (r.data.speaker_list || []).map(function (s) { return { id: s.id, name: s.name }; });
    cur.warnings = r.data.warnings || [];
    cur.stated_speakers = r.data.stated_speakers; cur.detected_speakers = r.data.detected_speakers;
    renderEditor();
    if (cur.redo_of) {
      // A redo has nothing to edit: show the price straight away; once the file is attached again, bring the Dub button into view.
      if (!pricePreview && !redoAuto[id]) {
        redoAuto[id] = true;
        loadPrice(true).then(function () { if (cur && cur.id === id && cur.media_present !== false && pricePreview) scrollToConfirm(); });
      } else if (cur.media_present !== false && pricePreview) scrollToConfirm();
    }
  });
}
function scrollToConfirm() { var ca = $("confirmArea"); if (ca && ca.scrollIntoView) { try { ca.scrollIntoView({ behavior: "smooth", block: "center" }); } catch (e) { ca.scrollIntoView(); } } }

function missingCount() { return segs.filter(function (s) { return !(s.arabic_text || "").trim(); }).length; }
function linesOf(spid) { return segs.filter(function (s) { return s.speaker_id === spid; }).length; }

function renderEditor() {
  if (!cur || cur.status !== "editing") return;
  var body = $("editorBody");
  if (!segs.length) { if (!body.innerHTML) body.innerHTML = "<p class='note'>" + esc(T.loading) + "</p>"; return; }
  body.innerHTML = "";
  var head = document.createElement("div");
  head.innerHTML =
    "<div class='ld-projhead' id='projHead'></div><div id='reattachBox'></div>" +
    (cur.redo_of ? "<div class='ld-warn'>" + esc(T.redoNote) + "</div>" : "") +
    "<p style='font-weight:600;margin:0 0 6px;'>" + esc(T.readyHead) + "</p>" +
    "<p class='note'>" + esc(T.editorNote) + "</p><p class='note'>" + esc(T.projNote) + "</p>" +
    subNoteHtml(cur) +
    ((cur.warnings || []).map(function (w) { return "<div class='ld-warn'>" + esc(w) + "</div>"; }).join("")) +
    "<div class='ld-spkpanel' id='spkPanel'></div><div id='glossPanel'></div><div id='subsPanel'></div>" +
    "<div class='ld-edhead'><strong id='lineCount'></strong><span class='ld-saved' id='savedState'></span></div>" +
    "<div class='ld-colhead'><div>" + esc(T.colTime) + "</div><div>" + esc(T.colEn) + "</div><div>" + esc(T.colAr) + "</div></div>";
  body.appendChild(head);
  renderProjHead();
  renderReattach();
  var list = document.createElement("div"); list.id = "segList";
  segs.forEach(function (s) { list.appendChild(buildRow(s)); });
  body.appendChild(list);
  var foot = document.createElement("div"); foot.id = "confirmArea";
  body.appendChild(foot);
  renderSpeakers();
  renderEditorExtras();
  renderConfirm();
  updateCount();
  setSaved(true);
}

// ---- speakers panel
function renderSpeakers() {
  var p = $("spkPanel"); if (!p) return;
  var max = cfg ? cfg.max_speakers : 8;
  var h = "<h4>" + esc(T.spkHeading) + "</h4><p class='note' style='margin:6px 0;'>" + esc(T.spkSummary(cur.stated_speakers || spk.length, cur.detected_speakers || spk.length)) + "</p>";
  spk.forEach(function (s, i) {
    var n = linesOf(s.id);
    h += '<div class="ld-spkrow"><input type="text" data-spk="' + i + '" maxlength="40" value="' + esc(s.name) + '" placeholder="' + esc(T.spkNamePh) + '">' +
         '<span class="cnt">' + esc(T.spkLines(n)) + '</span>' +
         '<button class="btn-plain" data-rm="' + i + '" ' + (n > 0 || spk.length <= 1 ? 'disabled title="' + esc(T.spkRemoveBlocked) + '"' : "") + ">" + esc(T.spkRemove) + "</button></div>";
  });
  h += '<div class="ld-row-btns"><button class="btn-plain" id="btnAddSpk" ' + (spk.length >= max ? "disabled" : "") + ">" + esc(T.spkAdd) + "</button></div>";
  h += '<div class="ld-err hidden" id="spkErr"></div>';
  p.innerHTML = h;
  Array.prototype.forEach.call(p.querySelectorAll("[data-spk]"), function (inp) {
    inp.oninput = function () { spk[+inp.dataset.spk].name = inp.value; refreshSelects(); queueSpeakerSave(); };
  });
  Array.prototype.forEach.call(p.querySelectorAll("[data-rm]"), function (btn) {
    btn.onclick = function () { spk.splice(+btn.dataset.rm, 1); saveSpeakers(true); };

  $("btnAddSpk").onclick = function () {

// Where the player gets its picture and sound: a small playable copy made on the server, or (saved project) the user's own file.
function plSource() {

  }
  if (localMedia && localMedia.jobId === cur.id) return Promise.resolve({ url: localMedia.url, kind: cur.has_video ? "video" : "audio" });

  return new Promise(function (resolve) {

    need.querySelector("#plPick").onclick = function () { fi.click(); };
    fi.onchange = function () {

    };

}

function plStartVideo(st, src) {
  var q = st.q, el = q("plVideo");
  st.el = el;
  if (src.kind === "audio") el.classList.add("audio");
  el.src = src.url;

  el.addEventListener("loadedmetadata", function () {

  el.addEventListener("pause", function () { q("plPlayBtn").textContent = T.plPlay; plRefresh(st); });
  el.addEventListener("ended", function () { q("plPlayBtn").textContent = T.plPlay; });
  q("plPlayBtn").onclick = function () { plToggle(st); };
  q("plSeek").oninput = function () { st.stopAt = null; el.currentTime = parseFloat(this.value); plRefresh(st); };
  Array.prototype.forEach.call(st.ov.querySelectorAll("[data-step]"), function (b) { b.onclick = function () { plStep(st, parseFloat(b.dataset.step)); }; });
  q("plSpeed").onchange = function () { el.playbackRate = parseFloat(this.value); };
  q("plBoost").onchange = function () { plBoost(st, parseFloat(this.value)); };
  q("plSetA").onclick = function () { plSetA(st); };
  q("plSetB").onclick = function () { plSetB(st); };
  q("plGoA").onclick = function () { st.stopAt = null; el.currentTime = st.a; };
  q("plGoB").onclick = function () { st.stopAt = null; el.currentTime = st.b; };
  q("plRange").onclick = function () {

      if (id === "plA") st.a = v; else st.b = v;
      this.value = plFmt(v); plRefresh(st);
    };

}

function plNowT(st) { return Math.round((st.el.currentTime || 0) * 1000) / 1000; }
function plRefresh(st) {

  var sk = q("plSeek"); if (document.activeElement !== sk) sk.value = t;

}
function plLoop(st) {

    if (!plState || plState !== st || !st.el || st.el.paused) { st.raf = 0; return; }
    if (st.stopAt !== null && st.el.currentTime >= st.stopAt) { st.el.pause(); st.el.currentTime = st.stopAt; st.stopAt = null; plRefresh(st); st.raf = 0; return; }

}
function plSetA(st) { if (!st.el) return; st.a = plNowT(st); st.q("plA").value = plFmt(st.a); st.err(""); plRefresh(st); }
function plSetB(st) { if (!st.el) return; st.b = plNowT(st); st.q("plB").value = plFmt(st.b); st.err(""); plRefresh(st); }

// Closing the box puts the times into the line (only when they changed).
function applyAndClose(st) {

    function (r) {

  pricePreview = null; tashNote = "";

function emoLabel(tag) {

}

}

window.addEventListener("resize", closeEmoPanel);

function parseEmotions(v) {
  var out = [];
  String(v || "neutral").split(",").forEach(function (p) {
    p = p.trim().toLowerCase();
    if (p && out.indexOf(p) < 0) out.push(p);
  });
  out = out.filter(function (p) { return p !== "neutral"; }).slice(0, EMO_MAX);

}

// A drop-down list with tick boxes: one line can have up to three delivery styles ("Curious, Hesitant").
function makeEmoPicker(value, onChange) {
  var cur = parseEmotions(value);
  var btn = document.createElement("button"); btn.type = "button"; btn.className = "btn-plain ld-emobtn";
  btn.title = T.emotionLbl; btn.setAttribute("aria-label", T.emotionLbl); btn.setAttribute("aria-haspopup", "true");
  var txt = document.createElement("span"); txt.className = "t";
  var car = document.createElement("span"); car.textContent = "▾"; car.setAttribute("aria-hidden", "true");
  btn.appendChild(txt); btn.appendChild(car);
  function refresh() { txt.textContent = emoLabelMulti(cur.join(", ")); btn.title = T.emotionLbl + ": " + txt.textContent; }
  refresh();

  function buildPanel() {
    var panel = document.createElement("div"); panel.className = "ld-emopanel"; panel.setAttribute("role", "listbox");
    panel.setAttribute("aria-multiselectable", "true");
    var hint = document.createElement("div"); hint.className = "hint"; panel.appendChild(hint);
    var boxes = [];
    function sync() {
      var n = cur.indexOf("neutral") >= 0 ? 0 : cur.length;
      hint.textContent = T.emoHint(n); hint.classList.remove("warn");
      boxes.forEach(function (b) {
        b.cb.checked = cur.indexOf(b.tag) >= 0;
        b.lab.classList.toggle("off", !b.cb.checked && b.tag !== "neutral" && n >= EMO_MAX);
      });
    }
    var tags = EMOTIONS.slice();
    cur.forEach(function (c) { if (tags.indexOf(c) < 0) tags.push(c); });     // a style we do not list stays visible
    tags.map(function (e) { return { e: e, l: emoLabel(e) }; })
      .sort(function (a, b) {
        if (a.e === "neutral") return -1; if (b.e === "neutral") return 1;
        return a.l.localeCompare(b.l, LANG === "ar" ? "ar" : "en", { sensitivity: "base" });
      })
      .forEach(function (x) {
        var lab = document.createElement("label");
        var cb = document.createElement("input"); cb.type = "checkbox"; cb.value = x.e;
        var sp = document.createElement("span"); sp.textContent = x.l;
        lab.appendChild(cb); lab.appendChild(sp); panel.appendChild(lab);
        boxes.push({ tag: x.e, cb: cb, lab: lab });
        cb.addEventListener("change", function () {
          var next;

            next = base.concat([x.e]);

            next = cur.filter(function (c) { return c !== x.e; });

  }

  btn.addEventListener("click", function (ev) {
    ev.stopPropagation();

    var r = btn.getBoundingClientRect(), pw = panel.offsetWidth, ph = panel.offsetHeight;
    var left = (LANG === "ar") ? r.right - pw : r.left;
    left = Math.max(8, Math.min(left, window.innerWidth - pw - 8));
    var top = (r.bottom + 4 + ph > window.innerHeight - 8 && r.top - 4 - ph > 8) ? r.top - 4 - ph : r.bottom + 4;
    panel.style.left = left + "px"; panel.style.top = Math.max(8, top) + "px";
    emoOpen = { btn: btn, panel: panel };
  });
  return { el: btn, set: function (v) { cur = parseEmotions(v); refresh(); } };
}

function buildRow(s) {
  var row = document.createElement("div"); row.className = "ld-seg"; row.dataset.id = s.segment_id;
  var time = document.createElement("div"); time.className = "ld-time";
  var tf0 = timeField(T.timeFrom), tf1 = timeField(T.timeTo);
  tf0.input.value = fmtMs(s.start); tf1.input.value = fmtMs(s.end);
  var terr = document.createElement("div"); terr.className = "ld-terr hidden";
  time.appendChild(tf0.wrap); time.appendChild(tf1.wrap); time.appendChild(terr);
  var sel = document.createElement("select"); sel.className = "ld-spksel"; fillSelect(sel, s.speaker_id);
  time.appendChild(sel);
  var lb = document.createElement("div"); lb.className = "ld-lbtns";
  var bIns = document.createElement("button"); bIns.className = "btn-plain"; bIns.textContent = T.insertLine;
  var bSplit = document.createElement("button"); bSplit.className = "btn-plain"; bSplit.textContent = T.splitLine; bSplit.title = T.splitHint;
  var bDel = document.createElement("button"); bDel.className = "btn-danger"; bDel.textContent = T.deleteLine;
  bDel.style.padding = "4px 10px"; bDel.style.fontSize = "12px";
  var bMan = document.createElement("button"); bMan.className = "btn-plain"; bMan.textContent = T.enterMan; bMan.title = T.enterManHint;
  lb.appendChild(bMan); lb.appendChild(bSplit); lb.appendChild(bIns); lb.appendChild(bDel); time.appendChild(lb);
  var en = document.createElement("textarea"); en.className = "en"; en.value = s.text || ""; en.dir = "ltr"; en.maxLength = 2000;
  var wrap = document.createElement("div"); wrap.className = "ld-arwrap";
  var ar = document.createElement("textarea"); ar.className = "ar"; ar.value = s.arabic_text || ""; ar.maxLength = 2000;
  ar.classList.toggle("missing", !ar.value.trim());
  var foot = document.createElement("div"); foot.className = "ld-arfoot";
  var cnt = document.createElement("span"); cnt.className = "ld-cnt"; cnt.textContent = T.chars((ar.value || "").length);
  var btn = document.createElement("button"); btn.className = "btn-plain"; btn.textContent = T.retranslate;
  var btnTash = document.createElement("button"); btnTash.type = "button"; btnTash.className = "btn-plain"; btnTash.textContent = T.tashkeel; btnTash.title = T.tashkeelHint;
  var emoPick = makeEmoPicker(s.emotion, function (v) { s.emotion = v; queueSave(s.segment_id, "emotion", v); pricePreview = null; });
  var footR = document.createElement("div"); footR.className = "ld-foot-r";
  footR.appendChild(emoPick.el); footR.appendChild(btnTash); footR.appendChild(btn);
  foot.appendChild(cnt); foot.appendChild(footR);
  wrap.appendChild(ar); wrap.appendChild(foot);
  row.appendChild(time); row.appendChild(en); row.appendChild(wrap);
  if (s.heard === false) { var un = document.createElement("div"); un.className = "ld-unheard"; un.textContent = T.unheardNote; row.appendChild(un); }
  bMan.addEventListener("click", function () { openPlayer(s); });

  function commitTime() {
    terr.classList.add("hidden");
    var a = parseT(tf0.input.value), b = parseT(tf1.input.value);
    var back = function () { tf0.input.value = fmtMs(s.start); tf1.input.value = fmtMs(s.end); };
    if (a === null || b === null) { terr.textContent = T.timeBad; terr.classList.remove("hidden"); back(); return; }
    // a box the user did not touch keeps its exact stored value (the box only shows tenths)
    var ns = tf0.input.value.trim() === fmtMs(s.start) ? s.start : a;
    var ne = tf1.input.value.trim() === fmtMs(s.end) ? s.end : b;
    if (ns === s.start && ne === s.end) return;
    lineOp(function () { return api("POST", "/api/longdub/" + cur.id + "/segments/time", { segment_id: s.segment_id, start: ns, end: ne }); },
      function (r) {
        if (!r.ok) { terr.textContent = safeErr(r.data.error, T.genericErr); terr.classList.remove("hidden"); back(); return; }
        applyRows(r.data.segments, s.segment_id);
      });
  }
  tf0.input.addEventListener("change", commitTime);
  tf1.input.addEventListener("change", commitTime);
  bIns.addEventListener("click", function () {
    lineOp(function () { return api("POST", "/api/longdub/" + cur.id + "/segments/insert", { segment_id: s.segment_id }); },
      function (r) {
        if (!r.ok) { alertMsg(safeErr(r.data.error, T.genericErr)); return; }
        applyRows(r.data.segments, r.data.new_id);
      });
  });
  var caretSet = false;       // only a cursor the user really placed counts
  ["click", "keyup", "select"].forEach(function (ev) { en.addEventListener(ev, function () { caretSet = true; }); });
  bSplit.addEventListener("click", function () {
    if (!caretSet) { alertMsg(T.splitHint); return; }
    var pos = en.selectionStart;
    var restore = function () { bSplit.disabled = false; bSplit.textContent = T.splitLine; };
    bSplit.disabled = true; bSplit.textContent = T.splitting;
    lineOp(function () { return api("POST", "/api/longdub/" + cur.id + "/segments/split", { segment_id: s.segment_id, position: pos }); },
      function (r) {
        restore();
        if (!r.ok) { alertMsg(safeErr(r.data.error, T.genericErr)); return; }
        delete dirty[s.segment_id];
        applyRows(r.data.segments, r.data.new_id);
      }).then(restore);
  });
  bDel.addEventListener("click", function () {
    var ask = (window.LisanDialog && LisanDialog.confirm) ? LisanDialog.confirm(T.confirmDelLine, { danger: true, okText: T.deleteLine }) : Promise.resolve(window.confirm(T.confirmDelLine));
    ask.then(function (yes) {
      if (!yes) return;
      delete dirty[s.segment_id];
      lineOp(function () { return api("POST", "/api/longdub/" + cur.id + "/segments/delete", { segment_id: s.segment_id }); },
        function (r) {
          if (!r.ok) { alertMsg(safeErr(r.data.error, T.genericErr)); return; }
          applyRows(r.data.segments, null);
        });
    });
  });
  sel.addEventListener("change", function () {
    s.speaker_id = sel.value; queueSave(s.segment_id, "speaker_id", sel.value); pricePreview = null;
    renderSpeakers();
  });
  btnTash.addEventListener("click", function () {
    btnTash.disabled = true; btnTash.textContent = T.tashkeelWorking;
    flushSave().then(function () { return api("POST", "/api/longdub/" + cur.id + "/tashkeel", { segment_id: s.segment_id }); }).then(function (r) {
      btnTash.disabled = false; btnTash.textContent = T.tashkeel;
      if (!r.ok) { alertMsg(safeErr(r.data.error, T.tashkeelFail)); return; }
      s.arabic_text = r.data.arabic_text || s.arabic_text; ar.value = s.arabic_text; autosize(ar); pricePreview = null;
      ar.classList.toggle("missing", !ar.value.trim()); cnt.textContent = T.chars(ar.value.length); updateCount();
    }).catch(function () { btnTash.disabled = false; btnTash.textContent = T.tashkeel; });
  });
  en.addEventListener("input", function () { s.text = en.value; queueSave(s.segment_id, "text", en.value); autosize(en); });
  ar.addEventListener("input", function () {
    s.arabic_text = ar.value; queueSave(s.segment_id, "arabic_text", ar.value); autosize(ar); pricePreview = null;
    ar.classList.toggle("missing", !ar.value.trim()); cnt.textContent = T.chars(ar.value.length); updateCount();
  });
  btn.addEventListener("click", function () {
    btn.disabled = true; btn.textContent = T.retranslating;
    flushSave().then(function () { return api("POST", "/api/longdub/" + cur.id + "/retranslate", { segment_id: s.segment_id }); }).then(function (r) {
      btn.disabled = false; btn.textContent = T.retranslate;
      if (!r.ok) { alertMsg(safeErr(r.data.error, T.retranslateFail)); return; }
      s.arabic_text = r.data.arabic_text || ""; ar.value = s.arabic_text; autosize(ar); pricePreview = null;
      if (r.data.emotion) { s.emotion = r.data.emotion; emoPick.set(s.emotion); }
      ar.classList.toggle("missing", !ar.value.trim()); cnt.textContent = T.chars(ar.value.length); updateCount();
    }).catch(function () { btn.disabled = false; btn.textContent = T.retranslate; });
  });
  setTimeout(function () { autosize(en); autosize(ar); }, 0);
  return row;
}

function updateCount() {
  var el = $("lineCount"); if (el) el.textContent = T.linesCount(segs.length, missingCount());
}

function setSaved(ok, text) {
  var el = $("savedState"); if (!el) return;
  el.textContent = text || (ok ? T.saved : T.saving);
}

function queueSave(id, field, value) {
  var d = dirty[id] || (dirty[id] = { segment_id: id });
  d[field] = value;
  setSaved(false);
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(flushSave, 900);
}

function flushSave(opts) {
  if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
  var ids = Object.keys(dirty);
  if (!ids.length || !cur) return Promise.resolve();
  if (saving) {
    // A save is already in flight. Wait for it (up to 15 s), then save whatever
    // was typed meanwhile -- so "Translate again", Tashkeel, Confirm etc. always
    // act on the text exactly as it is on screen, never on a stale copy.
    return new Promise(function (resolve) {
      var waited = 0, t = setInterval(function () {
        waited += 100;
        if (!saving || waited >= 15000) { clearInterval(t); saving = false; flushSave(opts).then(resolve, resolve); }
      }, 100);
    });
  }
  saving = true;
  var batch = ids.map(function (i) { return Object.assign({}, dirty[i]); });
  var jobId = cur.id;
  return api("PUT", "/api/longdub/" + jobId + "/segments", { edits: batch }, opts).then(function (r) {
    saving = false;
    if (!r.ok) { setSaved(false, T.saveFailed); saveTimer = setTimeout(flushSave, 3000); return; }
    batch.forEach(function (b) {
      var d = dirty[b.segment_id]; if (!d) return;
      ["text", "arabic_text", "speaker_id", "emotion"].forEach(function (f) { if (f in b && d[f] === b[f]) delete d[f]; });
      if (!("text" in d) && !("arabic_text" in d) && !("speaker_id" in d) && !("emotion" in d)) delete dirty[b.segment_id];
    });
    if (Object.keys(dirty).length) { saveTimer = setTimeout(flushSave, 400); setSaved(false); } else setSaved(true);
  }).catch(function () { saving = false; setSaved(false, T.saveFailed); saveTimer = setTimeout(flushSave, 3000); });
}

window.addEventListener("pagehide", function () { if (Object.keys(dirty).length) { saving = false; flushSave({ keepalive: true }); } });
window.addEventListener("beforeunload", function (e) { if (uploading) { e.preventDefault(); e.returnValue = ""; } });

// ---- confirm step
var roomPref = "auto";
var musicPref = true;       // keep the music under the original voices (confirm step)
function renderConfirm() {
  var a = $("confirmArea"); if (!a) return;
  var h = '<div class="ld-terms" style="margin-top:22px;"><h4>' + esc(T.confirmHeading) + "</h4>";
  if (!pricePreview) {
    h += '<div class="ld-row-btns"><button id="btnPrice">' + esc(T.checkPrice) + "</button>" +
         '<button class="btn-danger" id="btnDelete2">' + esc(T.deleteBtn) + "</button></div>";
  } else {
    var p = pricePreview;
    var row = function (label, n) { return "<tr><td>" + esc(label) + '</td><td class="num">' + n + "</td></tr>"; };
    h += "<p style='margin:4px 0;'>" + esc(T.priceLines(p.lines, p.chars)) + "</p>";
    if (p.lipsync) h += '<div class="ld-lipres"><label for="priceLipRes">' + esc(T.lipResLabel) + '</label><select id="priceLipRes">' + lipResOptions(p.lipsync.resolution || "720P") + "</select></div>";
    h += '<table class="ld-table">' + row(T.priceVoice, p.voice) + row(T.priceClones(p.speakers_used.length, p.clone_each), p.clones) +
         (p.lipsync && p.lipsync.clips ? row(T.priceLipRow(p.lipsync), p.lipsync.credits) : "") + row(T.priceMerge, p.merge) +
         '<tr class="total"><td>' + esc(T.priceDue) + '</td><td class="num">' + p.due + " " + esc(T.credits) + "</td></tr></table>";
    h += "<p class='ld-cnt'>" + esc(T.priceAlready(p.already_paid)) + " · " + esc(T.priceTotal(p.total)) + " · " + esc(T.estBalance(p.credits)) + "</p>";
    h += "<p class='ld-cnt'>" + esc(T.priceSpeakers) + " " + p.speakers_used.map(function (s) { return esc(s.name) + " (" + s.lines + ")"; }).join("، ") + "</p>";
    h += "<p class='ld-times'>" + esc(T.priceTime(p.time_min, p.time_max, !!(p.lipsync && p.lipsync.clips))) + "</p>";
    if (p.lipsync && !p.lipsync.clips) h += "<div class='ld-warn'>" + esc(T.priceLipNone) + "</div>";
    if (p.lipsync && p.lipsync.short) h += "<div class='ld-warn'>" + esc(T.priceLipShort(p.lipsync.short)) + "</div>";
    if (p.lines_without_arabic) h += "<div class='ld-warn'>" + esc(T.priceNoArabic(p.lines_without_arabic)) + "</div>";
    if (tashNote) h += "<div class='ld-warn'>" + esc(tashNote) + "</div>";
    if (lastErr) h += "<p class='ld-err'>" + esc(lastErr) + "</p>";
    var short = p.credits !== null && p.credits !== undefined && p.credits < p.due;
    if (short) h += "<p class='ld-err'>" + esc(T.notEnough(p.due, p.credits)) + ' <a href="/pricing" style="color:inherit;">' + esc(T.buyCredits) + "</a></p>";
    if (cfg && cfg.watermark) h += "<div class='ld-warn'>" + esc(T.wmNote) + ' <a href="/pricing">' + esc(T.buyCredits) + "</a></div>";
    h += '<div class="ld-room"><label for="roomPref">' + esc(T.roomLabel) + '</label><select id="roomPref">' +
         [["auto", T.roomAuto], ["lighter", T.roomLighter], ["much_lighter", T.roomMuch], ["off", T.roomNone]].map(function (o) {
           return '<option value="' + o[0] + '"' + (roomPref === o[0] ? " selected" : "") + ">" + esc(o[1]) + "</option>"; }).join("") +
         "</select></div><p class='note' style='margin-top:2px;'>" + esc(T.roomNote) + "</p>";
    h += '<label class="ld-agree" style="margin-top:12px;"><input type="checkbox" id="musicBox"' + (musicPref ? " checked" : "") + "><span>" + esc(T.musicAsk) + "</span></label><p class='note' style='margin-top:2px;'>" + esc(T.musicAskNote) + "</p>";
    if (cfg && cfg.music_fill && cfg.music_fill.available && cfg.music_fill.credits > 0) h += "<p class='note' style='margin-top:2px;'>" + esc(T.musicFillNote.replace("{n}", cfg.music_fill.credits)) + "</p>";
    h += '<label class="ld-agree" style="margin-top:12px;"><input type="checkbox" id="tracksBox"' + (tracksPref ? " checked" : "") + "><span>" + esc(T.tracksAsk) + "</span></label><p class='note' style='margin-top:2px;'>" + esc(T.tracksAskNote) + "</p>";
    h += "<p class='note'>" + esc(T.confirmRecap + (p.lipsync && p.lipsync.clips ? T.confirmRecapLip : "")) + "</p>";
    var noFile = cur && cur.media_present === false;
    if (noFile) h += "<div class='ld-warn'>" + esc(T.needFileToDub) + "</div>";
    h += '<div class="ld-row-btns"><button class="green" id="btnConfirm" ' + ((short || !p.lines || noFile) ? "disabled" : "") + ">" + esc(T.confirmBtn(p.due)) + "</button>" +
         '<button class="btn-plain" id="btnPrice">' + esc(T.refreshPrice) + '</button><button class="btn-danger" id="btnDelete2">' + esc(T.deleteBtn) + "</button></div>";
  }
  h += "</div>";
  a.innerHTML = h;
  var b;
  if ((b = $("btnPrice"))) b.onclick = loadPrice;
  var rp = $("roomPref"); if (rp) rp.onchange = function () { roomPref = rp.value; };
  var mb = $("musicBox"); if (mb) mb.onchange = function () { musicPref = mb.checked; };
  var tb = $("tracksBox"); if (tb) tb.onchange = function () { tracksPref = tb.checked; };
  var pr = $("priceLipRes"); if (pr) pr.onchange = function () { changeLipRes(pr, function () { loadPrice(true); }); };
  if ((b = $("btnConfirm"))) b.onclick = doConfirm;
  if ((b = $("btnDelete2"))) b.onclick = onDelete;
}

function loadPrice(quiet) {      // quiet === true: the automatic price on a redo, which never pops up an error box
  lastErr = ""; tashNote = "";
  var pb = $("btnPrice"); if (pb) { pb.disabled = true; pb.textContent = T.checking; }
  return flushSave().then(function () { return saveSpeakersIfPending(); }).then(function () {
    return api("GET", "/api/longdub/" + cur.id + "/preview");
  }).then(function (r) {
    if (!r.ok) { if (quiet !== true) alertMsg(safeErr(r.data.error, T.genericErr)); renderConfirm(); return; }
    pricePreview = r.data; setCredits(r.data.credits);
    if (r.data.tashkeel_added) {
      tashNote = T.priceTashkeel(r.data.tashkeel_added);
      // the Arabic text changed on the server: show it
      var id = cur.id;
      return api("GET", "/api/longdub/" + id + "/segments").then(function (g) {
        if (g.ok && cur && cur.id === id) { segs = g.data.segments || segs; renderEditor(); }
        else renderConfirm();
      });
    }
    renderConfirm();
  });
}
function saveSpeakersIfPending() { return spkTimer ? saveSpeakers(false) : Promise.resolve(); }

function doConfirm() {
  var p = pricePreview; if (!p) return;
  var msg = T.confirmAsk(p.due, p.credits);
  var ask = (window.LisanDialog && LisanDialog.confirm) ? LisanDialog.confirm(msg, { okText: T.confirmBtn(p.due) }) : Promise.resolve(window.confirm(msg));
  ask.then(function (yes) {
    if (!yes) return;
    var b = $("btnConfirm"); if (b) b.disabled = true;
    flushSave().then(function () { return api("POST", "/api/longdub/" + cur.id + "/confirm", { expected_due: p.due, room: roomPref, tracks: tracksPref, keep_music: musicPref }); }).then(function (r) {
      if (!r.ok) {
        lastErr = r.data.storage_full ? storageMsg(r.data) : safeErr(r.data.error, T.genericErr);
        if (r.status === 409 && r.data.price) {
          pricePreview = Object.assign({ credits: p.credits }, r.data.price); lastErr = T.priceChanged;
          var cid = cur.id;   // the Arabic text may have changed (tashkeel added at confirm): show it
          return api("GET", "/api/longdub/" + cid + "/segments").then(function (g) {
            if (g.ok && cur && cur.id === cid) { segs = g.data.segments || segs; renderEditor(); } else renderConfirm();
          });
        }
        renderConfirm(); return;
      }
      setCredits(r.data.credits);
      tracksPref = false;
      cur = r.data; segs = []; spk = [];
      render(); startPoll();
      loadList().then(renderList);
    }).catch(function () { lastErr = T.netErr; renderConfirm(); });
  });
}

// ------------------------------------------------------------------ init

(function init() {
  applyStaticText();
  var dz = $("dropZone"), fi = $("fileInput");
  dz.onclick = function () { fi.dataset.resume = ""; fi.dataset.reattach = ""; if (nameOk()) fi.click(); };
  dz.onkeydown = function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fi.dataset.resume = ""; fi.dataset.reattach = ""; if (nameOk()) fi.click(); } };
  ["dragenter", "dragover"].forEach(function (ev) { dz.addEventListener(ev, function (e) { e.preventDefault(); dz.classList.add("over"); }); });
  ["dragleave", "drop"].forEach(function (ev) { dz.addEventListener(ev, function (e) { e.preventDefault(); dz.classList.remove("over"); }); });
  dz.addEventListener("drop", function (e) { var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]; if (f) { fi.dataset.resume = ""; fi.dataset.reattach = ""; if (nameOk()) onFilePicked(f); } });
  fi.onchange = function () { onFilePicked(fi.files && fi.files[0]); };
  $("btnPickSub").onclick = function () { subTarget = ""; $("subFile").click(); };
  $("btnClearSub").onclick = function () { pendingSub = null; renderPendingSub(); };
  $("subFile").onchange = function () { var f = this.files && this.files[0]; this.value = ""; onSubPicked(f); };

  api("GET", "/api/longdub/config").then(function (r) {
    if (!r.ok) { showUploadError(safeErr(r.data.error, T.genericErr)); return; }
    cfg = r.data; setCredits(cfg.credits);
    applyConfigText();
    wireLipRes();
    return loadList().then(function () { selectJob(pickInitial()); });
  }).catch(function () { showUploadError(T.netErr); });
})();
