<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lisan AI — Dub Long Video</title>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="stylesheet" href="/styles.css">
<style>
  .ld-wrap { max-width: 1100px; margin: 0 auto; padding: 0 12px 60px; }
  .ld-drop {
    border: 2px dashed var(--border); border-radius: 12px; padding: 34px 16px; text-align: center;
    cursor: pointer; transition: border-color .2s, background .2s; margin-top: 12px;
  }
  .ld-drop:hover, .ld-drop.over { border-color: var(--accent); background: var(--muted-surface); }
  .ld-drop strong { display: block; font-size: 16px; margin-bottom: 6px; }
  .ld-spkask { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 14px; }
  .ld-spkask label { margin: 0; }
  .ld-spkask input { width: 80px; }
  .ld-lipask { margin-top: 16px; }
  .ld-lipask .ld-radio { display: flex; gap: 10px; align-items: flex-start; margin: 8px 0; cursor: pointer; font-size: 14px; line-height: 1.5; }
  .ld-lipask .ld-radio input { width: auto; margin-top: 4px; flex: none; }
  .ld-lipask .ld-radio.off { opacity: .55; cursor: not-allowed; }
  .ld-table { width: 100%; border-collapse: collapse; margin: 10px 0; }
  .ld-table td { padding: 9px 6px; border-bottom: 1px solid var(--border); font-size: 14px; vertical-align: top; }
  .ld-table td.num { text-align: end; font-weight: 700; white-space: nowrap; }
  .ld-table tr.total td { border-bottom: none; font-size: 16px; font-weight: 800; color: var(--primary-fg); padding-top: 14px; }
  .ld-table .sub { display: block; font-size: 12px; color: var(--text-muted); font-weight: 400; margin-top: 2px; }
  .ld-row-btns { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; align-items: center; }
  .ld-err { color: var(--error); font-size: 14px; margin-top: 10px; font-weight: 600; }
  .ld-warn { background: rgba(217,119,6,.12); border-left: 3px solid var(--warning); padding: 8px 12px; border-radius: 8px; font-size: 13px; margin: 8px 0; }
  .ld-status { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 12px; background: var(--muted-surface); color: var(--text-muted); }
  .ld-status.ok { color: var(--success); }
  .ld-status.bad { color: var(--error); }
  .ld-list-item { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; border-top: 1px solid var(--border); padding: 12px 0; }
  .ld-list-item:first-child { border-top: none; }
  .ld-list-name { font-weight: 700; word-break: break-all; }
  .ld-list-meta { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .btn-danger {
    padding: 10px 20px; background: var(--card); color: var(--error); border: 1px solid #fecaca;
    border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .btn-danger:hover { background: rgba(248,113,113,.12); transform: none; }
  body.dark .btn-danger { border-color: #7f1d1d; }
  .btn-plain { background: var(--logout-bg); color: var(--text-muted); border: 1px solid var(--border); }
  .btn-plain:hover { background: var(--logout-hover-bg); }
  a.ld-dl { display: inline-block; padding: 12px 24px; background: var(--success); color: #fff; border-radius: 8px; font-weight: 700; text-decoration: none; }

  .ld-terms { border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; margin: 12px 0; background: var(--muted-surface); }
  .ld-terms h4 { margin: 0 0 6px; font-size: 14px; }
  .ld-terms ul { margin: 6px 18px; padding: 0; font-size: 13px; line-height: 1.6; }
  .ld-agree { display: flex; gap: 10px; align-items: flex-start; margin-top: 10px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .ld-agree input { width: auto; margin-top: 3px; }
  .ld-times { font-size: 14px; margin: 8px 0; }
  .ld-upsell { text-align: center; padding: 10px 0; }

  /* Editor */
  .ld-edhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .ld-saved { font-size: 13px; color: var(--text-muted); }
  .ld-spkpanel { border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; margin: 10px 0 16px; }
  .ld-spkpanel h4 { margin: 0 0 4px; font-size: 15px; }
  .ld-spkrow { display: flex; gap: 10px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
  .ld-spkrow input { max-width: 260px; }
  .ld-spkrow .cnt { font-size: 12px; color: var(--text-muted); min-width: 70px; }
  .ld-seg { display: grid; grid-template-columns: 190px 1fr 1fr; gap: 10px; padding: 12px 0; border-top: 1px solid var(--border); align-items: start; }
  .ld-seg:first-child { border-top: none; }
  .ld-time { font-size: 12px; color: var(--text-muted); line-height: 1.5; }
  .ld-time b { display: block; color: var(--text); font-size: 13px; }
  .ld-time select { margin-top: 6px; padding: 6px 8px; font-size: 13px; }
  .ld-tf { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; font-size: 12px; }
  .ld-tf span { width: 30px; }
  .ld-tf input.ld-t { width: 82px; padding: 5px 6px; font-size: 13px; text-align: center; font-variant-numeric: tabular-nums; }
  .ld-terr { color: var(--error); font-size: 11px; margin: 2px 0 4px; line-height: 1.4; }
  .ld-lbtns { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .ld-lbtns button { padding: 4px 10px; font-size: 12px; }
  .ld-seg textarea { min-height: 54px; width: 100%; resize: vertical; line-height: 1.5; }
  .ld-seg textarea.missing { border-color: var(--error); }
  .ld-arwrap { display: flex; flex-direction: column; gap: 6px; }
  .ld-arwrap textarea { direction: rtl; text-align: right; font-size: 16px; }
  .ld-arfoot { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .ld-arfoot button { padding: 5px 12px; font-size: 12px; }
  .ld-cnt { font-size: 11px; color: var(--text-muted); }
  .ld-colhead { display: grid; grid-template-columns: 190px 1fr 1fr; gap: 10px; font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: .03em; padding-bottom: 6px; border-bottom: 2px solid var(--border); }
  @media (max-width: 720px) {
    .ld-seg, .ld-colhead { grid-template-columns: 1fr; }
    .ld-colhead { display: none; }
    .card { margin: 10px 0; padding: 18px; }
  }
  html[dir="rtl"] .ld-wrap { direction: rtl; }
  html[dir="rtl"] .note { border-left: none; border-right: 3px solid var(--accent); }
  html[dir="rtl"] .ld-warn { border-left: none; border-right: 3px solid var(--warning); }
  html[dir="rtl"] .ld-seg textarea.en { direction: ltr; text-align: left; }
  html[dir="rtl"] #userBar { direction: rtl; }
</style>
</head>
<body>
<div id="userBar">
  <div class="brand-row" style="display:flex;align-items:center;gap:10px;">
    <img src="/logo.png" style="height:30px;" alt="">
    <strong id="pageTitle" style="color:#1a237e;">Lisan AI — Dub Long Video</strong>
  </div>
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
    <button id="langBtn" class="btn-logout" title="Language" onclick="window._toggleLang()">العربية</button>
    <button id="darkModeBtn" class="btn-logout" title="Toggle dark mode" onclick="window._toggleDarkMode()">🌙</button>
    <span class="credits-badge" style="display:inline-block;">💰 <span id="creditsNum">–</span> <span id="creditsWord">credits</span></span>
    <button id="backBtn" class="btn-logout" onclick="location.href='/app'">← Back to App</button>
    <button id="logoutBtn" class="btn-logout" onclick="fetch('/api/logout',{method:'POST'}).then(function(){location.href='/login'})">Log Out</button>
  </div>
</div>

<div class="ld-wrap">

  <div class="card" id="introCard">
    <h3 id="introHeading">🎞️ Dub Long Video</h3>
    <p id="introText" class="note"></p>
    <ol id="introSteps" style="margin:10px 22px;line-height:1.7;font-size:14px;"></ol>
  </div>

  <div class="card hidden" id="upsellCard">
    <h3 id="upsellHeading">Studio plan</h3>
    <div class="ld-upsell">
      <p id="upsellText" style="margin-bottom:14px;"></p>
      <a id="upsellBtn" class="ld-dl" href="/pricing"></a>
    </div>
  </div>

  <div class="card" id="uploadCard">
    <h3 id="uploadHeading">1. Upload your video</h3>
    <div class="ld-spkask">
      <label for="spkCount" id="spkAskLabel">How many people speak in this video?</label>
      <input type="number" id="spkCount" min="1" max="8" value="2">
    </div>
    <p class="note" id="spkAskNote"></p>
    <div class="ld-lipask" id="lipAsk">
      <strong id="lipAskLabel"></strong>
      <label class="ld-radio"><input type="radio" name="lipsync" id="lipNo" value="0" checked><span id="lipNoText"></span></label>
      <label class="ld-radio" id="lipYesWrap"><input type="radio" name="lipsync" id="lipYes" value="1"><span id="lipYesText"></span></label>
      <p class="note" id="lipAskNote"></p>
    </div>
    <div class="ld-drop" id="dropZone" tabindex="0">
      <strong id="dropTitle">Choose a video or audio file</strong>
      <span id="dropHint" class="note" style="display:inline-block;border:none;background:none;padding:0;margin:0;"></span>
    </div>
    <input type="file" id="fileInput" accept="video/*,audio/*,.mkv,.mov,.mp4,.webm,.avi,.mp3,.wav,.m4a,.aac,.flac,.ogg" class="hidden">
    <div id="uploadError" class="ld-err hidden"></div>
  </div>

  <div class="card hidden" id="jobCard">
    <h3 id="jobHeading">Your video</h3>
    <div id="jobBody"></div>
  </div>

  <div class="card hidden" id="editorCard">
    <h3 id="editorHeading">3. Review and edit</h3>
    <div id="editorBody"></div>
  </div>

  <div class="card hidden" id="listCard">
    <h3 id="listHeading">My long dubs</h3>
    <div id="listBody"></div>
  </div>

</div>

<script src="/dialogs.js"></script>
<script>
// ---- Dark mode (same key + logic as account.html) ----
(function () {
  function apply(on) {
    try {
      document.body.classList.toggle("dark", !!on);
      localStorage.setItem("lisan_dark_mode", on ? "1" : "0");
      var db = document.getElementById("darkModeBtn");
      if (db) db.textContent = on ? "☀️" : "🌙";
    } catch (e) {}
  }
  window._toggleDarkMode = function () { apply(!document.body.classList.contains("dark")); };
  var saved;
  try { saved = localStorage.getItem("lisan_dark_mode"); } catch (e) { saved = null; }
  apply(saved === "1");
})();

var LANG = "en";
try { LANG = (localStorage.getItem("lisan_lang") === "ar") ? "ar" : "en"; } catch (e) {}
window._toggleLang = function () {
  try { localStorage.setItem("lisan_lang", LANG === "ar" ? "en" : "ar"); } catch (e) {}
  location.reload();
};

var T = {
  en: {

    estBalance: function (b) { return "Your balance: " + b + " credits"; },
    estAlready: function (n) { return "You have already paid " + n + " credits for this estimate — it counts toward the total."; },

    estDeclineNote: "If you don't accept, that is all you pay.",

    terms: function (e) {
      return [

        "The exact price is calculated from your edited Arabic text and shown to you before the dubbing starts — nothing more is charged without your confirmation.",

    minShort: "د", loading: "جارٍ التحميل…", genericErr: "حدث خطأ ما. حاول مرة أخرى.",
    netErr: "مشكلة في الاتصال. تحقق من الإنترنت وحاول مرة أخرى."
  }
}[LANG];

var LS_KEY = "lisan_longdub_job";
var cfg = null;          // /api/longdub/config
var jobs = [];           // list of public job views
var cur = null;          // job currently on screen
var segs = [];           // transcript rows while editing
var spk = [];            // speaker list while editing [{id, name}]
var dirty = {};          // segment_id -> {segment_id, text?, arabic_text?, speaker_id?} waiting to be saved
var saveTimer = null, saving = false, spkTimer = null;
var pollTimer = null;
var uploading = false, uploadAbort = false;
var lastErr = "";
var pricePreview = null; // result of /preview while confirming
var tashNote = "";       // shown under the price when tashkeel was just added

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function fmtTime(sec) { sec = Math.max(0, Math.round(sec || 0)); var m = Math.floor(sec / 60), s = sec % 60; return m + ":" + (s < 10 ? "0" : "") + s; }
function fmtMin(sec) { return (Math.round((sec || 0) / 6) / 10).toString(); }
function fmtDate(ts) { try { return new Date(ts * 1000).toLocaleString(LANG === "ar" ? "ar" : undefined, { dateStyle: "medium", timeStyle: "short" }); } catch (e) { return ""; } }
function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
function alertMsg(m) { if (window.LisanDialog && LisanDialog.alert) return LisanDialog.alert(m); alert(m); return Promise.resolve(); }

function api(method, url, body, opts) {
  var init = { method: method, headers: {} };
  if (body !== undefined && body !== null) { init.headers["Content-Type"] = "application/json"; init.body = JSON.stringify(body); }
  if (opts && opts.keepalive) init.keepalive = true;
  return fetch(url, init).then(function (r) {
    if (r.status === 401) { location.href = "/login"; return new Promise(function () {}); }
    return r.json().catch(function () { return {}; }).then(function (d) { return { ok: r.ok, status: r.status, data: d || {} }; });
  });
}

function setCredits(n) {
  if (n === undefined || n === null) return;
  if (cfg) cfg.credits = n;
  $("creditsNum").textContent = n;
}

function applyStaticText() {
  document.documentElement.lang = LANG;
  if (LANG === "ar") document.documentElement.dir = "rtl";
  document.title = T.title;
  $("pageTitle").textContent = T.title;
  $("creditsWord").textContent = T.credits;
  $("backBtn").textContent = T.back;
  $("logoutBtn").textContent = T.logout;
  $("langBtn").textContent = LANG === "ar" ? "English" : "العربية";
  $("introHeading").textContent = T.introHeading;
  $("uploadHeading").textContent = T.uploadHeading;
  $("spkAskLabel").textContent = T.spkAskLabel;
  $("spkAskNote").textContent = T.spkAskNote;
  $("lipAskLabel").textContent = T.lipAskLabel;
  $("lipNoText").textContent = T.lipNoText;
  $("lipYesText").textContent = T.lipYesText;
  $("dropTitle").textContent = T.dropTitle;
  $("listHeading").textContent = T.listHeading;
  $("jobHeading").textContent = T.jobHeading;
  $("editorHeading").textContent = T.editorHeading;
  $("upsellHeading").textContent = T.upsellHeading;
  $("upsellText").textContent = T.upsellText;
  $("upsellBtn").textContent = T.upsellBtn;
}

function applyConfigText() {
  var maxMin = cfg ? cfg.max_min : 10;
  $("introText").textContent = T.introText(maxMin);
  $("introSteps").innerHTML = T.introSteps.map(function (s) { return "<li>" + esc(s) + "</li>"; }).join("");
  $("dropHint").textContent = T.dropHint(maxMin, cfg ? cfg.max_upload_mb : 2048);
  $("spkCount").max = cfg ? cfg.max_speakers : 8;
  var lc = (cfg && cfg.lipsync) || { available: false, per_sec: 0, max_min: 0 };
  if (lc.available) {
    $("lipAskNote").textContent = T.lipAskNote(lc.per_sec, lc.max_min);
    $("lipYes").disabled = false; $("lipYesWrap").classList.remove("off");
  } else {
    $("lipAskNote").textContent = T.lipUnavailable;
    $("lipYes").disabled = true; $("lipYes").checked = false; $("lipNo").checked = true; $("lipYesWrap").classList.add("off");
  }
}

// ------------------------------------------------------------------ jobs

function isOpen(st) { return ["done", "failed", "cancelled", "expired"].indexOf(st) < 0; }
function isWorking(st) { return ["accepted", "analyzing", "confirmed", "dubbing"].indexOf(st) >= 0; }

function loadList() {
  return api("GET", "/api/longdub").then(function (r) {
    if (!r.ok) return;
    jobs = r.data.jobs || [];
    setCredits(r.data.credits);
  });
}

function pickInitial() {
  var stored = null;
  try { stored = localStorage.getItem(LS_KEY); } catch (e) {}
  var j = null;
  if (stored) j = jobs.filter(function (x) { return x.id === stored; })[0] || null;
  if (!j) j = jobs.filter(function (x) { return isOpen(x.status); })[0] || null;
  return j;
}

function selectJob(j) {
  stopPoll();
  cur = j || null;
  segs = []; spk = []; dirty = {}; pricePreview = null; tashNote = ""; lastErr = "";
  try { if (cur) localStorage.setItem(LS_KEY, cur.id); else localStorage.removeItem(LS_KEY); } catch (e) {}
  render();
  if (cur && cur.status === "editing") loadSegments();
  if (cur && isWorking(cur.status)) startPoll();
}

function refreshCurrent() {
  if (!cur) return Promise.resolve();
  var id = cur.id;
  return api("GET", "/api/longdub/" + id).then(function (r) {
    if (!cur || cur.id !== id) return;
    if (r.status === 404) { selectJob(null); return loadList().then(renderList); }
    if (!r.ok) return;
    var was = cur.status;
    cur = r.data;
    if (cur.status !== was) {
      if (!isWorking(cur.status)) stopPoll();
      render();
      if (cur.status === "editing") loadSegments();
      loadList().then(renderList);
    } else {
      renderJob();
    }
  });
}

function startPoll() { stopPoll(); pollTimer = setInterval(refreshCurrent, 4000); }
function stopPoll() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }

// ---------------------------------------------------------------- render

function render() {
  var st = cur ? cur.status : null;
  var studio = !cfg || cfg.studio;
  $("upsellCard").classList.toggle("hidden", studio);
  $("uploadCard").classList.toggle("hidden", !studio || (!!cur && (isOpen(st) || st === "done")));
  $("jobCard").classList.toggle("hidden", !cur || st === "editing");
  $("editorCard").classList.toggle("hidden", !cur || st !== "editing");
  renderJob();
  renderEditor();
  renderList();
}

function statusBadge(st) {
  var cls = (st === "done" || st === "editing") ? "ok" : (st === "failed" || st === "cancelled" || st === "expired") ? "bad" : "";
  return '<span class="ld-status ' + cls + '">' + esc(T.st[st] || st) + "</span>";
}

function renderJob() {
  if (!cur) { $("jobBody").innerHTML = ""; return; }
  var j = cur, h = "";
  var heading = T.jobHeading;
  if (j.status === "estimated") heading = T.estHeading;
  else if (j.status === "accepted" || j.status === "analyzing") heading = T.analyzingHeading;
  else if (j.status === "confirmed" || j.status === "dubbing") heading = T.dubbingHeading;
  else if (j.status === "failed") heading = T.failedHeading;
  else if (j.status === "done") heading = T.doneHeading;
  $("jobHeading").textContent = heading;
  var name = '<p style="margin:0 0 6px;"><strong style="word-break:break-all;">' + esc(j.filename) + "</strong> " + statusBadge(j.status) + "</p>";

  if (j.status === "uploading") {
    var pct = j.percent || 0;
    h += name;
    h += '<div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div>';
    h += "<p class='note'>" + esc(uploading ? T.uploadingPct(pct, j.received_count || 0, j.total_chunks || 0) : T.uploadPaused) + "</p>";
    if (!uploading) {
      if (j.total_chunks && (j.received_count || 0) >= j.total_chunks) {
        h += '<div class="ld-row-btns"><button id="btnFinish">' + esc(T.finishBtn) + "</button></div>";
      } else {
        h += '<div class="ld-row-btns"><button id="btnResume">' + esc(T.chooseSame) + "</button></div>";
      }
    }
    h += '<div class="ld-row-btns"><button class="btn-plain" id="btnDelete">' + esc(T.cancelUpload) + "</button></div>";
  } else if (j.status === "estimated") {
    h += name + renderEstimate(j);
  } else if (isWorking(j.status)) {
    h += name;
    h += '<div class="progress-bar"><div class="progress-fill" style="width:' + (j.percent || 0) + '%"></div></div>';
    var label = (j.stage === "queued" || !j.stage) ? T.queued : (T.stage[j.stage] || j.message || "");
    var extra = "";
    if (j.message && (j.stage === "transcribe" || j.stage === "separate" || j.stage === "translate" || j.stage === "speak" || j.stage === "mix" || j.stage === "lipsync")) {
      var m = String(j.message).match(/\(([^)]*)\)/); if (m) extra = " (" + m[1].replace(/part|lines|line|clip/g, "").replace(/\s+/g, " ").trim() + ")";
    }
    h += "<p style='font-weight:600;'>" + esc(label + extra) + " <span style='color:var(--text-muted);font-weight:400;'>" + (j.percent || 0) + "%</span></p>";
    h += "<p class='note'>" + esc(j.stage === "lipsync" ? T.lipNote : ((j.status === "confirmed" || j.status === "dubbing") ? T.dubbingNote : T.analyzingNote)) + "</p>";
  } else if (j.status === "failed") {
    h += name + "<p class='ld-err'>" + esc(j.error || j.message || T.genericErr) + "</p>";
    h += '<div class="ld-row-btns"><button id="btnNew">' + esc(T.startNew) + '</button><button class="btn-plain" id="btnDelete">' + esc(T.deleteBtn) + "</button></div>";
  } else if (j.status === "done") {
    var r = j.result || {};
    h += name;
    if (j.file_available) {
      h += "<p>" + esc(T.doneText(r.kind === "audio" ? T.kindAudio : T.kindVideo, fmtTime(r.duration))) + "</p>";
      if (r.failed_lines) h += "<div class='ld-warn'>" + esc(T.doneWarn(r.failed_lines)) + "</div>";
      var at = function (a) { return a.map(fmtTime).join("، "); };
      if (r.rephrased && r.rephrased.length) {
        h += "<div class='ld-warn'>" + esc(T.doneRephrased(r.n_rephrased || r.rephrased.length, at(r.rephrased.map(function (x) { return x.t; })), r.rephrase_refund || 0)) + "</div>";
        h += "<details style='margin:6px 0 10px;'><summary style='cursor:pointer;font-size:13px;'>" + esc(T.showChanges) + "</summary>" +
          r.rephrased.map(function (x) {
            return "<div style='border-top:1px solid var(--border);padding:8px 0;font-size:13px;'><b>" + esc(fmtTime(x.t)) + "</b>" +
              "<div style='color:var(--text-muted);'>" + esc(T.chBefore) + "</div><div dir='rtl' style='font-size:15px;'>" + esc(x.before) + "</div>" +
              "<div style='color:var(--text-muted);margin-top:4px;'>" + esc(T.chAfter) + "</div><div dir='rtl' style='font-size:15px;'>" + esc(x.after) + "</div></div>";
          }).join("") + "</details>";
      }
      if (r.timing && r.timing.n_cut) h += "<div class='ld-warn'>" + esc(T.doneCut(r.timing.n_cut, at(r.timing.cut) + (r.timing.n_cut > r.timing.cut.length ? " …" : ""))) + "</div>";
      if (r.timing && r.timing.n_fast) h += "<div class='ld-warn'>" + esc(T.doneFast(r.timing.n_fast, at(r.timing.fast) + (r.timing.n_fast > r.timing.fast.length ? " …" : ""))) + "</div>";
      if (r.lipsync) h += "<p class='note'>" + esc(T.doneLip(r.lipsync.synced, r.lipsync.clips)) + "</p>";
      h += '<div class="ld-row-btns"><a class="ld-dl" href="/api/longdub/' + esc(j.id) + '/download">' + esc(T.download) + "</a></div>";
    } else {
      h += "<p class='note'>" + esc(T.fileGone) + "</p>";
    }
    h += '<div class="ld-row-btns"><button id="btnNew">' + esc(T.startNew) + "</button></div>";
  } else {
    h += name;
    h += '<div class="ld-row-btns"><button id="btnNew">' + esc(T.startNew) + "</button></div>";
  }
  if (lastErr) h += '<div class="ld-err">' + esc(lastErr) + "</div>";
  $("jobBody").innerHTML = h;
  wireJobButtons();
}

function renderEstimate(j) {
  var e = j.estimate || {}, paid = (j.paid && j.paid.fee) || 0;
  var bal = cfg ? cfg.credits : null;
  var remaining = (e.total || 0) - paid;
  var short = (bal !== null && bal !== undefined) && bal < remaining;
  var row = function (label, sub, n) {
    return "<tr><td>" + esc(label) + (sub ? '<span class="sub">' + esc(sub) + "</span>" : "") + '</td><td class="num">' + n + "</td></tr>";
  };
  var n = e.speakers || e.assumed_speakers || 2;
  var lipOn = !!(e.lipsync_wanted);
  var h = "<p style='margin:4px 0 10px;color:var(--text-muted);'>" + esc(T.estIntro(j.filename, fmtMin(j.duration), n, lipOn)) + "</p>";
  h += '<table class="ld-table">';
  h += row(T.estFeeRow, T.estFeeSub, e.fee);
  h += row(T.estAnalysisRow, T.estAnalysisSub, e.analysis);
  h += row(T.estVoiceRow, T.estVoiceSub, "≈ " + e.voice);
  h += row(T.estCloneRow(n, e.clone_each), T.estCloneSub, e.clones);
  if (lipOn) h += row(T.estLipRow, T.estLipSub(e.lipsync_per_sec), "≤ " + e.lipsync);
  h += row(T.estMergeRow, T.estMergeSub, e.merge);
  h += '<tr class="total"><td>' + esc(T.estTotal) + '</td><td class="num">≈ ' + e.total + " " + esc(T.credits) + "</td></tr>";
  h += "</table>";
  if (e.times) h += "<p class='ld-times'>" + esc(T.estTimes(e.times)) + "</p>";
  h += "<p style='font-weight:600;'>" + esc(bal === null || bal === undefined ? "" : T.estBalance(bal)) + "</p>";
  if (paid) h += "<p class='note'>" + esc(T.estAlready(paid)) + " " + esc(T.estDeclineNote) + "</p>";
  h += "<p class='note'>" + esc(T.estNow(e.analysis || 0)) + "</p>";
  h += '<div class="ld-terms"><h4>' + esc(T.termsHeading) + "</h4><ul>" + T.terms(e).map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>" +
       '<label class="ld-agree"><input type="checkbox" id="agreeBox"><span>' + esc(T.agree) + "</span></label></div>";
  if (short) h += "<p class='ld-err'>" + esc(T.notEnough(remaining, bal)) + ' <a href="/pricing" style="color:inherit;">' + esc(T.buyCredits) + "</a></p>";
  h += '<div class="ld-row-btns"><button class="green" id="btnAccept" disabled>' + esc(T.acceptBtn) + '</button><button class="btn-plain" id="btnDelete">' + esc(T.declineBtn) + "</button></div>";
  window._estShort = short;
  return h;
}

function wireJobButtons() {
  var b;
  if ((b = $("btnAccept"))) b.onclick = onAccept;
  if ((b = $("agreeBox"))) b.onchange = function () { var ag = $("agreeBox"), ac = $("btnAccept"); if (ac) ac.disabled = !(ag && ag.checked) || !!window._estShort; };
  if ((b = $("btnDelete"))) b.onclick = onDelete;
  if ((b = $("btnNew"))) b.onclick = function () { selectJob(null); };
  if ((b = $("btnFinish"))) b.onclick = function () { finishUpload(cur); };
  if ((b = $("btnResume"))) b.onclick = function () { $("fileInput").dataset.resume = "1"; $("fileInput").click(); };
}

function renderList() {
  $("listCard").classList.toggle("hidden", !jobs.length);
  var h = "";
  jobs.forEach(function (j) {
    h += '<div class="ld-list-item"><div><div class="ld-list-name">' + esc(j.filename) + "</div>" +
      '<div class="ld-list-meta">' + statusBadge(j.status) + " · " + fmtMin(j.duration) + " " + esc(T.minShort) + " · " + esc(fmtDate(j.updated || j.created)) + "</div></div>" +
      '<div style="display:flex;gap:8px;"><button data-open="' + esc(j.id) + '" class="btn-plain">' + esc(T.openBtn) + '</button><button data-del="' + esc(j.id) + '" class="btn-danger">' + esc(T.deleteBtn) + "</button></div></div>";
  });
  $("listBody").innerHTML = h;
  Array.prototype.forEach.call($("listBody").querySelectorAll("[data-open]"), function (btn) {
    btn.onclick = function () { var j = jobs.filter(function (x) { return x.id === btn.dataset.open; })[0]; if (j) selectJob(j); window.scrollTo(0, 0); };
  });
  Array.prototype.forEach.call($("listBody").querySelectorAll("[data-del]"), function (btn) {
    btn.onclick = function () { var j = jobs.filter(function (x) { return x.id === btn.dataset.del; })[0]; if (j) deleteJob(j); };
  });
}

// ---------------------------------------------------------------- upload

function showUploadError(msg) {
  var el = $("uploadError");
  el.textContent = msg || "";
  el.classList.toggle("hidden", !msg);
}

function onFilePicked(file) {
  showUploadError("");
  lastErr = "";
  if (!file) return;
  var resume = $("fileInput").dataset.resume === "1";
  $("fileInput").dataset.resume = "";
  $("fileInput").value = "";
  if (resume && cur && cur.status === "uploading") {
    if (file.name !== cur.filename || file.size !== cur.size) { lastErr = T.wrongFile; renderJob(); return; }
    continueUpload(cur, file);
    return;
  }
  var maxMb = cfg ? cfg.max_upload_mb : 2048;
  if (file.size > maxMb * 1048576) { showUploadError(T.tooBig(Math.round(file.size / 1048576), maxMb)); return; }
  var maxSp = cfg ? cfg.max_speakers : 8;
  var nsp = parseInt($("spkCount").value, 10);
  if (!(nsp >= 1 && nsp <= maxSp)) { showUploadError(T.spkBad(maxSp)); return; }
  var wantLip = !!($("lipYes") && $("lipYes").checked && !$("lipYes").disabled);
  if (wantLip && /\.(mp3|wav|m4a|aac|flac|ogg)$/i.test(file.name)) { showUploadError(T.lipAudio); return; }
  api("POST", "/api/longdub/init", { filename: file.name, size: file.size, speakers: nsp, lipsync: wantLip }).then(function (r) {
    if (!r.ok) { showUploadError(r.data.error || T.genericErr); return; }
    cur = r.data; jobs.unshift(cur);
    try { localStorage.setItem(LS_KEY, cur.id); } catch (e) {}
    render();
    continueUpload(cur, file);
  }).catch(function () { showUploadError(T.netErr); });
}

async function putChunk(job, index, blob) {
  var lastMsg = "";
  for (var attempt = 1; attempt <= 6; attempt++) {
    if (uploadAbort) return { ok: false, aborted: true };
    try {
      var r = await fetch("/api/longdub/" + job.id + "/chunk?index=" + index, { method: "PUT", headers: { "Content-Type": "application/octet-stream" }, body: blob });
      if (r.status === 401) { location.href = "/login"; return { ok: false }; }
      if (r.ok) return { ok: true };
      var d = {}; try { d = await r.json(); } catch (e) {}
      lastMsg = d.error || ("HTTP " + r.status);
      if (r.status >= 400 && r.status < 500 && r.status !== 429 && r.status !== 408) return { ok: false, msg: lastMsg };
    } catch (e) { lastMsg = T.netErr; }
    await sleep(1200 * attempt);
  }
  return { ok: false, msg: lastMsg };
}

async function continueUpload(job, file) {
  if (uploading) return;
  uploading = true; uploadAbort = false; lastErr = "";
  try {
    var st = await api("GET", "/api/longdub/" + job.id);
    if (!st.ok) { lastErr = st.data.error || T.genericErr; return; }
    var have = {}; (st.data.received || []).forEach(function (i) { have[i] = true; });
    var total = job.total_chunks, cb = cfg.chunk_bytes;
    job.received_count = Object.keys(have).length;
    for (var i = 0; i < total; i++) {
      if (have[i]) continue;
      if (uploadAbort) return;
      var blob = file.slice(i * cb, Math.min(file.size, (i + 1) * cb));
      var res = await putChunk(job, i, blob);
      if (!res.ok) { if (!res.aborted) lastErr = res.msg || T.netErr; return; }
      have[i] = true;
      job.received_count = Object.keys(have).length;
      job.percent = Math.floor(100 * job.received_count / total);
      renderJob();
    }
    uploading = false;
    await finishUpload(job);
  } finally {
    if (uploading) { uploading = false; if (cur && cur.id === job.id) renderJob(); }
  }
}

function finishUpload(job) {
  uploading = false;
  $("jobBody").insertAdjacentHTML("beforeend", "<p class='note'>" + esc(T.finishing) + "</p>");
  return api("POST", "/api/longdub/" + job.id + "/finish").then(function (r) {
    if (!r.ok) {
      lastErr = r.data.error || T.genericErr;
      // The server removes a file it can't use (too long, no audio...).
      return loadList().then(function () {
        var still = jobs.filter(function (x) { return x.id === job.id; })[0];
        if (still) { cur = still; render(); }
        else { var m = lastErr; selectJob(null); showUploadError(m); lastErr = ""; }
      });
    }
    setCredits(r.data.credits);
    cur = r.data; lastErr = "";
    return loadList().then(function () { render(); });
  }).catch(function () { lastErr = T.netErr; renderJob(); });
}

// --------------------------------------------------------- accept / delete

function onAccept() {
  var b = $("btnAccept"); if (b) b.disabled = true;
  lastErr = "";
  api("POST", "/api/longdub/" + cur.id + "/accept", { agree: !!($("agreeBox") && $("agreeBox").checked) }).then(function (r) {
    if (!r.ok) { lastErr = r.data.error || T.genericErr; renderJob(); return; }
    setCredits(r.data.credits);
    cur = r.data;
    render(); startPoll();
    loadList().then(renderList);
  }).catch(function () { lastErr = T.netErr; renderJob(); });
}

function onDelete() { deleteJob(cur); }

function deleteJob(j) {
  var msg = j.status === "editing" ? T.confirmDeleteEdit : (j.status === "estimated" ? T.confirmDeleteEst : T.confirmDeleteAny);
  var ask = (window.LisanDialog && LisanDialog.confirm) ? LisanDialog.confirm(msg, { danger: true, okText: T.deleteBtn }) : Promise.resolve(window.confirm(msg));
  ask.then(function (yes) {
    if (!yes) return;
    if (uploading && cur && cur.id === j.id) uploadAbort = true;
    api("DELETE", "/api/longdub/" + j.id).then(function (r) {
      if (!r.ok) { alertMsg(r.data.error || T.genericErr); return; }
      jobs = jobs.filter(function (x) { return x.id !== j.id; });
      if (cur && cur.id === j.id) selectJob(null); else renderList();
    });
  });
}

// ---------------------------------------------------------------- editor

function loadSegments() {
  var id = cur.id;
  $("editorBody").innerHTML = "<p class='note'>" + esc(T.loading) + "</p>";
  api("GET", "/api/longdub/" + id + "/segments").then(function (r) {
    if (!cur || cur.id !== id) return;
    if (!r.ok) { $("editorBody").innerHTML = "<p class='ld-err'>" + esc(r.data.error || T.genericErr) + "</p>"; return; }
    segs = r.data.segments || [];
    spk = (r.data.speaker_list || []).map(function (s) { return { id: s.id, name: s.name }; });
    cur.warnings = r.data.warnings || [];
    cur.stated_speakers = r.data.stated_speakers; cur.detected_speakers = r.data.detected_speakers;
    renderEditor();
  });
}

function missingCount() { return segs.filter(function (s) { return !(s.arabic_text || "").trim(); }).length; }
function linesOf(spid) { return segs.filter(function (s) { return s.speaker_id === spid; }).length; }

function renderEditor() {
  if (!cur || cur.status !== "editing") return;
  var body = $("editorBody");
  if (!segs.length) { if (!body.innerHTML) body.innerHTML = "<p class='note'>" + esc(T.loading) + "</p>"; return; }
  body.innerHTML = "";
  var head = document.createElement("div");
  head.innerHTML =
    "<p class='note'>" + esc(T.editorNote) + "</p>" +
    ((cur.warnings || []).map(function (w) { return "<div class='ld-warn'>" + esc(w) + "</div>"; }).join("")) +
    "<div class='ld-spkpanel' id='spkPanel'></div>" +
    "<div class='ld-edhead'><strong id='lineCount'></strong><span class='ld-saved' id='savedState'></span></div>" +
    "<div class='ld-colhead'><div>" + esc(T.colTime) + "</div><div>" + esc(T.colEn) + "</div><div>" + esc(T.colAr) + "</div></div>";
  body.appendChild(head);
  var list = document.createElement("div"); list.id = "segList";
  segs.forEach(function (s) { list.appendChild(buildRow(s)); });
  body.appendChild(list);
  var foot = document.createElement("div"); foot.id = "confirmArea";
  body.appendChild(foot);
  renderSpeakers();
  renderConfirm();
  updateCount();
  setSaved(true);
}

// ---- speakers panel
function renderSpeakers() {
  var p = $("spkPanel"); if (!p) return;
  var max = cfg ? cfg.max_speakers : 8;
  var h = "<h4>" + esc(T.spkHeading) + "</h4><p class='note' style='margin:6px 0;'>" + esc(T.spkSummary(cur.stated_speakers || spk.length, cur.detected_speakers || spk.length)) + "</p>";
  spk.forEach(function (s, i) {
    var n = linesOf(s.id);
    h += '<div class="ld-spkrow"><input type="text" data-spk="' + i + '" maxlength="40" value="' + esc(s.name) + '" placeholder="' + esc(T.spkNamePh) + '">' +
         '<span class="cnt">' + esc(T.spkLines(n)) + '</span>' +
         '<button class="btn-plain" data-rm="' + i + '" ' + (n > 0 || spk.length <= 1 ? 'disabled title="' + esc(T.spkRemoveBlocked) + '"' : "") + ">" + esc(T.spkRemove) + "</button></div>";
  });
  h += '<div class="ld-row-btns"><button class="btn-plain" id="btnAddSpk" ' + (spk.length >= max ? "disabled" : "") + ">" + esc(T.spkAdd) + "</button></div>";
  h += '<div class="ld-err hidden" id="spkErr"></div>';
  p.innerHTML = h;
  Array.prototype.forEach.call(p.querySelectorAll("[data-spk]"), function (inp) {
    inp.oninput = function () { spk[+inp.dataset.spk].name = inp.value; refreshSelects(); queueSpeakerSave(); };
  });
  Array.prototype.forEach.call(p.querySelectorAll("[data-rm]"), function (btn) {
    btn.onclick = function () { spk.splice(+btn.dataset.rm, 1); saveSpeakers(true); };
  });
  $("btnAddSpk").onclick = function () {
    var k = spk.length + 1, name;
    do { name = (LANG === "ar" ? "متحدث " : "Speaker ") + k; k++; } while (spk.some(function (s) { return s.name.toLowerCase() === name.toLowerCase(); }));
    spk.push({ id: "", name: name }); saveSpeakers(true);
  };
}

function refreshSelects() {
  Array.prototype.forEach.call(document.querySelectorAll(".ld-spksel"), function (sel) { fillSelect(sel, sel.value); });
}

function fillSelect(sel, current) {
  sel.innerHTML = spk.map(function (s) { return '<option value="' + esc(s.id) + '"' + (s.id === current ? " selected" : "") + ">" + esc(s.name || "—") + "</option>"; }).join("");
}

function queueSpeakerSave() {
  if (spkTimer) clearTimeout(spkTimer);
  setSaved(false);
  spkTimer = setTimeout(function () { saveSpeakers(false); }, 800);
}

function saveSpeakers(rerender) {
  if (spkTimer) { clearTimeout(spkTimer); spkTimer = null; }
  var sent = spk.map(function (s) { return { id: s.id, name: s.name }; });
  var err = $("spkErr");
  return api("PUT", "/api/longdub/" + cur.id + "/speakers", { speakers: sent }).then(function (r) {
    if (!r.ok) {
      if (err) { err.textContent = r.data.error || T.genericErr; err.classList.remove("hidden"); }
      setSaved(false, T.saveFailed);
      if (rerender) return loadSegments();
      return;
    }
    if (err) err.classList.add("hidden");
    (r.data.speaker_list || []).forEach(function (s, i) { if (spk[i]) spk[i].id = s.id; });
    // rows already point at the right ids; refresh dropdowns and the panel
    refreshSelects(); pricePreview = null;
    if (rerender) { renderSpeakers(); renderConfirm(); }
    setSaved(true);
  }).catch(function () { setSaved(false, T.saveFailed); });
}

// ---- transcript rows
function autosize(ta) { ta.style.height = "auto"; ta.style.height = Math.max(54, ta.scrollHeight + 2) + "px"; }

function fmtT(sec) {
  var t = Math.round(Math.max(0, +sec || 0) * 10) / 10, m = Math.floor(t / 60), x = t - m * 60;
  return m + ":" + (x < 10 ? "0" : "") + x.toFixed(1);
}
// "1:23.5", "83.5" or Arabic digits -> seconds, or null when it isn't a time
function parseT(str) {
  var t = String(str || "").trim().replace(/[\u0660-\u0669]/g, function (d) { return String(d.charCodeAt(0) - 1632); })
    .replace(/[\u06F0-\u06F9]/g, function (d) { return String(d.charCodeAt(0) - 1776); }).replace(/[,\u066B\u060C]/g, ".");
  var m = t.match(/^(?:(\d+):)?(\d+(?:\.\d+)?)$/);
  if (!m) return null;
  return (m[1] ? parseInt(m[1], 10) * 60 : 0) + parseFloat(m[2]);
}
function timeField(label) {
  var w = document.createElement("label"); w.className = "ld-tf";
  var sp = document.createElement("span"); sp.textContent = label;
  var inp = document.createElement("input"); inp.type = "text"; inp.className = "ld-t"; inp.dir = "ltr";
  inp.maxLength = 12; inp.autocomplete = "off"; inp.setAttribute("inputmode", "decimal");
  w.appendChild(sp); w.appendChild(inp);
  return { wrap: w, input: inp };
}

var lineBusy = false;
// Insert / delete / time change: send what is typed first, then do the change on the server, then show the rows it returns.
function lineOp(send, done) {
  if (lineBusy) return Promise.resolve();
  lineBusy = true;
  return flushSave().then(send).then(function (r) { lineBusy = false; done(r); })
    .catch(function () { lineBusy = false; alertMsg(T.netErr); });
}

function applyRows(rows, focusId) {
  segs = (rows || []).map(function (r) {
    var d = dirty[r.segment_id];      // text typed but not yet saved stays as typed
    if (d) ["text", "arabic_text", "speaker_id"].forEach(function (f) { if (f in d) r[f] = d[f]; });
    return r;
  });
  Object.keys(dirty).forEach(function (id) { if (!segs.some(function (x) { return x.segment_id === id; })) delete dirty[id]; });
  pricePreview = null; tashNote = "";
  var list = $("segList");
  if (list) { list.innerHTML = ""; segs.forEach(function (x) { list.appendChild(buildRow(x)); }); }
  renderSpeakers(); renderConfirm(); updateCount();
  if (focusId && list) {
    var row = list.querySelector('[data-id="' + focusId + '"]');
    if (row) { try { row.scrollIntoView({ block: "center" }); } catch (e) {} var ta = row.querySelector("textarea.ar"); if (ta && document.activeElement && document.activeElement.tagName !== "TEXTAREA") ta.focus(); }
  }
}

function buildRow(s) {
  var row = document.createElement("div"); row.className = "ld-seg"; row.dataset.id = s.segment_id;
  var time = document.createElement("div"); time.className = "ld-time";
  var tf0 = timeField(T.timeFrom), tf1 = timeField(T.timeTo);
  tf0.input.value = fmtT(s.start); tf1.input.value = fmtT(s.end);
  var terr = document.createElement("div"); terr.className = "ld-terr hidden";
  time.appendChild(tf0.wrap); time.appendChild(tf1.wrap); time.appendChild(terr);
  var sel = document.createElement("select"); sel.className = "ld-spksel"; fillSelect(sel, s.speaker_id);
  time.appendChild(sel);
  var lb = document.createElement("div"); lb.className = "ld-lbtns";
  var bIns = document.createElement("button"); bIns.className = "btn-plain"; bIns.textContent = T.insertLine;
  var bDel = document.createElement("button"); bDel.className = "btn-danger"; bDel.textContent = T.deleteLine;
  bDel.style.padding = "4px 10px"; bDel.style.fontSize = "12px";
  lb.appendChild(bIns); lb.appendChild(bDel); time.appendChild(lb);
  var en = document.createElement("textarea"); en.className = "en"; en.value = s.text || ""; en.dir = "ltr"; en.maxLength = 2000;
  var wrap = document.createElement("div"); wrap.className = "ld-arwrap";
  var ar = document.createElement("textarea"); ar.className = "ar"; ar.value = s.arabic_text || ""; ar.maxLength = 2000;
  ar.classList.toggle("missing", !ar.value.trim());
  var foot = document.createElement("div"); foot.className = "ld-arfoot";
  var cnt = document.createElement("span"); cnt.className = "ld-cnt"; cnt.textContent = T.chars((ar.value || "").length);
  var btn = document.createElement("button"); btn.className = "btn-plain"; btn.textContent = T.retranslate;
  foot.appendChild(cnt); foot.appendChild(btn);
  wrap.appendChild(ar); wrap.appendChild(foot);
  row.appendChild(time); row.appendChild(en); row.appendChild(wrap);

  function commitTime() {
    terr.classList.add("hidden");
    var a = parseT(tf0.input.value), b = parseT(tf1.input.value);
    var back = function () { tf0.input.value = fmtT(s.start); tf1.input.value = fmtT(s.end); };
    if (a === null || b === null) { terr.textContent = T.timeBad; terr.classList.remove("hidden"); back(); return; }
    // a box the user did not touch keeps its exact stored value (the box only shows tenths)
    var ns = tf0.input.value.trim() === fmtT(s.start) ? s.start : a;
    var ne = tf1.input.value.trim() === fmtT(s.end) ? s.end : b;
    if (ns === s.start && ne === s.end) return;
    lineOp(function () { return api("POST", "/api/longdub/" + cur.id + "/segments/time", { segment_id: s.segment_id, start: ns, end: ne }); },
      function (r) {
        if (!r.ok) { terr.textContent = r.data.error || T.genericErr; terr.classList.remove("hidden"); back(); return; }
        applyRows(r.data.segments, s.segment_id);
      });
  }
  tf0.input.addEventListener("change", commitTime);
  tf1.input.addEventListener("change", commitTime);
  bIns.addEventListener("click", function () {
    lineOp(function () { return api("POST", "/api/longdub/" + cur.id + "/segments/insert", { segment_id: s.segment_id }); },
      function (r) {
        if (!r.ok) { alertMsg(r.data.error || T.genericErr); return; }
        applyRows(r.data.segments, r.data.new_id);
      });
  });
  bDel.addEventListener("click", function () {
    var ask = (window.LisanDialog && LisanDialog.confirm) ? LisanDialog.confirm(T.confirmDelLine, { danger: true, okText: T.deleteLine }) : Promise.resolve(window.confirm(T.confirmDelLine));
    ask.then(function (yes) {
      if (!yes) return;
      delete dirty[s.segment_id];
      lineOp(function () { return api("POST", "/api/longdub/" + cur.id + "/segments/delete", { segment_id: s.segment_id }); },
        function (r) {
          if (!r.ok) { alertMsg(r.data.error || T.genericErr); return; }
          applyRows(r.data.segments, null);
        });
    });
  });
  sel.addEventListener("change", function () {
    s.speaker_id = sel.value; queueSave(s.segment_id, "speaker_id", sel.value); pricePreview = null;
    renderSpeakers();
  });
  en.addEventListener("input", function () { s.text = en.value; queueSave(s.segment_id, "text", en.value); autosize(en); });
  ar.addEventListener("input", function () {
    s.arabic_text = ar.value; queueSave(s.segment_id, "arabic_text", ar.value); autosize(ar); pricePreview = null;
    ar.classList.toggle("missing", !ar.value.trim()); cnt.textContent = T.chars(ar.value.length); updateCount();
  });
  btn.addEventListener("click", function () {
    btn.disabled = true; btn.textContent = T.retranslating;
    flushSave().then(function () { return api("POST", "/api/longdub/" + cur.id + "/retranslate", { segment_id: s.segment_id }); }).then(function (r) {
      btn.disabled = false; btn.textContent = T.retranslate;
      if (!r.ok) { alertMsg(r.data.error || T.retranslateFail); return; }
      s.arabic_text = r.data.arabic_text || ""; ar.value = s.arabic_text; autosize(ar); pricePreview = null;
      ar.classList.toggle("missing", !ar.value.trim()); cnt.textContent = T.chars(ar.value.length); updateCount();
    }).catch(function () { btn.disabled = false; btn.textContent = T.retranslate; });
  });
  setTimeout(function () { autosize(en); autosize(ar); }, 0);
  return row;
}

function updateCount() {
  var el = $("lineCount"); if (el) el.textContent = T.linesCount(segs.length, missingCount());
}

function setSaved(ok, text) {
  var el = $("savedState"); if (!el) return;
  el.textContent = text || (ok ? T.saved : T.saving);
}

function queueSave(id, field, value) {
  var d = dirty[id] || (dirty[id] = { segment_id: id });
  d[field] = value;
  setSaved(false);
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(flushSave, 900);
}

function flushSave(opts) {
  if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
  var ids = Object.keys(dirty);
  if (!ids.length || !cur || saving) return Promise.resolve();
  saving = true;
  var batch = ids.map(function (i) { return Object.assign({}, dirty[i]); });
  var jobId = cur.id;
  return api("PUT", "/api/longdub/" + jobId + "/segments", { edits: batch }, opts).then(function (r) {
    saving = false;
    if (!r.ok) { setSaved(false, T.saveFailed); saveTimer = setTimeout(flushSave, 3000); return; }
    batch.forEach(function (b) {
      var d = dirty[b.segment_id]; if (!d) return;
      ["text", "arabic_text", "speaker_id"].forEach(function (f) { if (f in b && d[f] === b[f]) delete d[f]; });
      if (!("text" in d) && !("arabic_text" in d) && !("speaker_id" in d)) delete dirty[b.segment_id];
    });
    if (Object.keys(dirty).length) { saveTimer = setTimeout(flushSave, 400); setSaved(false); } else setSaved(true);
  }).catch(function () { saving = false; setSaved(false, T.saveFailed); saveTimer = setTimeout(flushSave, 3000); });
}

window.addEventListener("pagehide", function () { if (Object.keys(dirty).length) { saving = false; flushSave({ keepalive: true }); } });
window.addEventListener("beforeunload", function (e) { if (uploading) { e.preventDefault(); e.returnValue = ""; } });

// ---- confirm step
function renderConfirm() {
  var a = $("confirmArea"); if (!a) return;
  var h = '<div class="ld-terms" style="margin-top:22px;"><h4>' + esc(T.confirmHeading) + "</h4>";
  if (!pricePreview) {
    h += '<div class="ld-row-btns"><button id="btnPrice">' + esc(T.checkPrice) + "</button>" +
         '<button class="btn-danger" id="btnDelete2">' + esc(T.deleteBtn) + "</button></div>";
  } else {
    var p = pricePreview;
    var row = function (label, n) { return "<tr><td>" + esc(label) + '</td><td class="num">' + n + "</td></tr>"; };
    h += "<p style='margin:4px 0;'>" + esc(T.priceLines(p.lines, p.chars)) + "</p>";
    h += '<table class="ld-table">' + row(T.priceVoice, p.voice) + row(T.priceClones(p.speakers_used.length, p.clone_each), p.clones) +
         (p.lipsync && p.lipsync.clips ? row(T.priceLipRow(p.lipsync), p.lipsync.credits) : "") + row(T.priceMerge, p.merge) +
         '<tr class="total"><td>' + esc(T.priceDue) + '</td><td class="num">' + p.due + " " + esc(T.credits) + "</td></tr></table>";
    h += "<p class='ld-cnt'>" + esc(T.priceAlready(p.already_paid)) + " · " + esc(T.priceTotal(p.total)) + " · " + esc(T.estBalance(p.credits)) + "</p>";
    h += "<p class='ld-cnt'>" + esc(T.priceSpeakers) + " " + p.speakers_used.map(function (s) { return esc(s.name) + " (" + s.lines + ")"; }).join("، ") + "</p>";
    h += "<p class='ld-times'>" + esc(T.priceTime(p.time_min, p.time_max, !!(p.lipsync && p.lipsync.clips))) + "</p>";
    if (p.lipsync && !p.lipsync.clips) h += "<div class='ld-warn'>" + esc(T.priceLipNone) + "</div>";
    if (p.lipsync && p.lipsync.short) h += "<div class='ld-warn'>" + esc(T.priceLipShort(p.lipsync.short)) + "</div>";
    if (p.lines_without_arabic) h += "<div class='ld-warn'>" + esc(T.priceNoArabic(p.lines_without_arabic)) + "</div>";
    if (tashNote) h += "<div class='ld-warn'>" + esc(tashNote) + "</div>";
    if (lastErr) h += "<p class='ld-err'>" + esc(lastErr) + "</p>";
    var short = p.credits !== null && p.credits !== undefined && p.credits < p.due;
    if (short) h += "<p class='ld-err'>" + esc(T.notEnough(p.due, p.credits)) + ' <a href="/pricing" style="color:inherit;">' + esc(T.buyCredits) + "</a></p>";
    h += "<p class='note'>" + esc(T.confirmRecap + (p.lipsync && p.lipsync.clips ? T.confirmRecapLip : "")) + "</p>";
    h += '<div class="ld-row-btns"><button class="green" id="btnConfirm" ' + ((short || !p.lines) ? "disabled" : "") + ">" + esc(T.confirmBtn(p.due)) + "</button>" +
         '<button class="btn-plain" id="btnPrice">' + esc(T.refreshPrice) + '</button><button class="btn-danger" id="btnDelete2">' + esc(T.deleteBtn) + "</button></div>";
  }
  h += "</div>";
  a.innerHTML = h;
  var b;
  if ((b = $("btnPrice"))) b.onclick = loadPrice;
  if ((b = $("btnConfirm"))) b.onclick = doConfirm;
  if ((b = $("btnDelete2"))) b.onclick = onDelete;
}

function loadPrice() {
  lastErr = ""; tashNote = "";
  var pb = $("btnPrice"); if (pb) { pb.disabled = true; pb.textContent = T.checking; }
  return flushSave().then(function () { return saveSpeakersIfPending(); }).then(function () {
    return api("GET", "/api/longdub/" + cur.id + "/preview");
  }).then(function (r) {
    if (!r.ok) { alertMsg(r.data.error || T.genericErr); renderConfirm(); return; }
    pricePreview = r.data; setCredits(r.data.credits);
    if (r.data.tashkeel_added) {
      tashNote = T.priceTashkeel(r.data.tashkeel_added);
      // the Arabic text changed on the server: show it
      var id = cur.id;
      return api("GET", "/api/longdub/" + id + "/segments").then(function (g) {
        if (g.ok && cur && cur.id === id) { segs = g.data.segments || segs; renderEditor(); }
        else renderConfirm();
      });
    }
    renderConfirm();
  });
}
function saveSpeakersIfPending() { return spkTimer ? saveSpeakers(false) : Promise.resolve(); }

function doConfirm() {
  var p = pricePreview; if (!p) return;
  var msg = T.confirmAsk(p.due, p.credits);
  var ask = (window.LisanDialog && LisanDialog.confirm) ? LisanDialog.confirm(msg, { okText: T.confirmBtn(p.due) }) : Promise.resolve(window.confirm(msg));
  ask.then(function (yes) {
    if (!yes) return;
    var b = $("btnConfirm"); if (b) b.disabled = true;
    flushSave().then(function () { return api("POST", "/api/longdub/" + cur.id + "/confirm", { expected_due: p.due }); }).then(function (r) {
      if (!r.ok) {
        lastErr = r.data.error || T.genericErr;
        if (r.status === 409 && r.data.price) {
          pricePreview = Object.assign({ credits: p.credits }, r.data.price); lastErr = T.priceChanged;
          var cid = cur.id;   // the Arabic text may have changed (tashkeel added at confirm): show it
          return api("GET", "/api/longdub/" + cid + "/segments").then(function (g) {
            if (g.ok && cur && cur.id === cid) { segs = g.data.segments || segs; renderEditor(); } else renderConfirm();
          });
        }
        renderConfirm(); return;
      }
      setCredits(r.data.credits);
      cur = r.data; segs = []; spk = [];
      render(); startPoll();
      loadList().then(renderList);
    }).catch(function () { lastErr = T.netErr; renderConfirm(); });
  });
}

// ------------------------------------------------------------------ init

(function init() {
  applyStaticText();
  var dz = $("dropZone"), fi = $("fileInput");
  dz.onclick = function () { fi.dataset.resume = ""; fi.click(); };
  dz.onkeydown = function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fi.dataset.resume = ""; fi.click(); } };
  ["dragenter", "dragover"].forEach(function (ev) { dz.addEventListener(ev, function (e) { e.preventDefault(); dz.classList.add("over"); }); });
  ["dragleave", "drop"].forEach(function (ev) { dz.addEventListener(ev, function (e) { e.preventDefault(); dz.classList.remove("over"); }); });
  dz.addEventListener("drop", function (e) { var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]; if (f) { fi.dataset.resume = ""; onFilePicked(f); } });
  fi.onchange = function () { onFilePicked(fi.files && fi.files[0]); };

  api("GET", "/api/longdub/config").then(function (r) {
    if (!r.ok) { showUploadError(r.data.error || T.genericErr); return; }
    cfg = r.data; setCredits(cfg.credits);
    applyConfigText();
    return loadList().then(function () { selectJob(pickInitial()); });
  }).catch(function () { showUploadError(T.netErr); });
})();
</script>
