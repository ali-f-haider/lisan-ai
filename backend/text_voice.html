<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lisan AI — Text to voice</title>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="stylesheet" href="/styles.css">
<style>
.tv-wrap { max-width: 980px; margin: 0 auto; padding: 0 12px 60px; }
html[dir="rtl"] .tv-wrap { direction: rtl; }
.tv-wrap label { display: block; font-weight: 600; margin: 12px 0 4px; }
.tv-wrap input[type=text], .tv-wrap select, .tv-wrap textarea { width: 100%; box-sizing: border-box; padding: 9px 11px; border: 1px solid var(--border);
  border-radius: 8px; background: var(--input-bg); color: var(--text); font: inherit; }
.tv-wrap textarea#tvText, .tv-wrap #tvText { min-height: 220px; resize: vertical; line-height: 1.6; }
/* The formatted text boxes (1.97.1): names in their speaker's color, human sounds like (LAUGH) as an amber mark */
:root { --tv-sound-bg: #fde68a; --tv-sound-fg: #78350f; --tv-n0: #1d4ed8; --tv-n1: #b91c1c; --tv-n2: #15803d; --tv-n3: #7e22ce;
  --tv-n4: #0f766e; --tv-n5: #be185d; --tv-n6: #4d7c0f; --tv-n7: #0e7490; }
body.dark { --tv-sound-bg: #78350f; --tv-sound-fg: #fde68a; --tv-n0: #93c5fd; --tv-n1: #fca5a5; --tv-n2: #86efac; --tv-n3: #d8b4fe;
  --tv-n4: #5eead4; --tv-n5: #f9a8d4; --tv-n6: #bef264; --tv-n7: #67e8f9; }
.tv-rich { width: 100%; box-sizing: border-box; padding: 9px 11px; border: 1px solid var(--border); border-radius: 8px; background: var(--input-bg);
  color: var(--text); font: inherit; white-space: pre-wrap; overflow-wrap: anywhere; overflow-y: auto; outline: none; cursor: text; }
.tv-rich:focus { border-color: var(--primary); box-shadow: 0 0 0 2px color-mix(in srgb, var(--primary) 25%, transparent); }
.tv-rich:empty::before { content: attr(data-ph); color: var(--text-muted); pointer-events: none; }
.tv-rich.is-disabled { opacity: .65; cursor: default; }
#tvText.tv-rich { max-height: 60vh; }
.tv-sound { background: var(--tv-sound-bg); color: var(--tv-sound-fg); border-radius: 4px; font-weight: 700; box-shadow: 0 0 0 1px var(--tv-sound-bg); }
.tv-name { font-weight: 700; }
.tv-wrap .tv-n0 { color: var(--tv-n0); } .tv-wrap .tv-n1 { color: var(--tv-n1); } .tv-wrap .tv-n2 { color: var(--tv-n2); } .tv-wrap .tv-n3 { color: var(--tv-n3); }
.tv-wrap .tv-n4 { color: var(--tv-n4); } .tv-wrap .tv-n5 { color: var(--tv-n5); } .tv-wrap .tv-n6 { color: var(--tv-n6); } .tv-wrap .tv-n7 { color: var(--tv-n7); }
.tv-addsound { width: auto !important; padding: 3px 8px !important; font-size: 13px; }
.tv-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 14px; }
.tv-grid2 { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; }
@media (max-width: 640px) { .tv-grid2 { grid-template-columns: 1fr; } }
.tv-count { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
.tv-err { color: var(--error); font-weight: 600; margin-top: 10px; white-space: pre-wrap; }
.tv-ok { color: var(--success); font-weight: 600; margin-top: 10px; }
.btn-plain { background: var(--logout-bg); color: var(--text-muted); border: 1px solid var(--border); }
.btn-plain:hover { background: var(--logout-hover-bg); }
.tv-spk { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin: 10px 0; background: var(--muted-surface); }
.tv-spk-head { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.tv-spk-head strong { font-size: 15px; min-width: 120px; }
.tv-spk-head select { width: auto; min-width: 130px; }
.tv-voice-name { font-size: 13px; color: var(--text-muted); }
.tv-panel { margin-top: 10px; border-top: 1px solid var(--border); padding-top: 10px; }
.tv-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.tv-tabs button { padding: 6px 12px; font-size: 13px; }
.tv-tabs button.on { background: var(--primary); color: #fff; }
.tv-vlist { max-height: 300px; overflow: auto; border: 1px solid var(--border); border-radius: 8px; }
.tv-vrow { display: flex; gap: 8px; align-items: center; justify-content: space-between; padding: 7px 10px; border-bottom: 1px solid var(--border); }
.tv-vrow:last-child { border-bottom: none; }
.tv-vrow span { font-size: 14px; }
.tv-vrow button { padding: 5px 10px; font-size: 13px; }
.tv-line { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin: 8px 0; }
.tv-line-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; }
.tv-line-head b { color: var(--text); }
.tv-line-src { font-size: 14px; color: var(--text-muted); margin-bottom: 6px; white-space: pre-wrap; }
.tv-line textarea, .tv-line .tv-rich { direction: rtl; text-align: right; font-size: 18px; line-height: 1.9; min-height: 52px; resize: vertical; }
.tv-line select { width: auto; font-size: 13px; padding: 4px 8px; }
.tv-voice { font-size: 14px; color: var(--text-muted); margin-top: 4px; }
.tv-exact { display: inline-flex; gap: 6px; align-items: center; margin-top: 4px; font-size: 13px; font-weight: 400; cursor: pointer; }
.tv-voice mark { background: rgba(245, 158, 11, .25); color: inherit; border-radius: 3px; padding: 0 1px; }
.tv-badge { background: var(--warning); color: #111; border-radius: 6px; padding: 1px 7px; font-size: 12px; font-weight: 700; }
.tv-proj { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); }
.tv-proj:last-child { border-bottom: none; }
.tv-proj .meta { font-size: 12px; color: var(--text-muted); }
.tv-bar { height: 10px; background: var(--muted-surface); border-radius: 6px; overflow: hidden; margin-top: 10px; border: 1px solid var(--border); }
.tv-bar > div { height: 100%; background: var(--primary); width: 0; transition: width .4s; }
.tv-wrap audio { width: 100%; margin-top: 12px; }
.tv-rec { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
.tv-consent { display: flex !important; gap: 8px; align-items: flex-start; font-weight: 500 !important; }
.tv-consent input { margin-top: 4px; }
</style>
<script src="/pwa.js" defer></script><script src="/feedback.js" defer></script>
</head>
<body>
<div id="userBar">
  <div class="brand-row" style="display:flex;align-items:center;gap:10px;">
    <img src="/logo.png" style="height:30px;" alt="">
    <strong id="pageTitle" style="color:#1a237e;">Lisan AI — Text to voice</strong>
  </div>
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
    <button id="langBtn" class="btn-logout" title="Language" onclick="window._toggleLang()">العربية</button>
    <button id="darkModeBtn" class="btn-logout" title="Toggle dark mode" onclick="window._toggleDarkMode()">🌙</button>
    <span class="credits-badge" style="display:inline-block;">💰 <span id="creditsNum">–</span> <span id="creditsWord">credits</span></span>
    <button id="backBtn" class="btn-logout" onclick="location.href='/app'">← Back to App</button>
    <button id="logoutBtn" class="btn-logout" onclick="try{sessionStorage.removeItem('lisan_notify_log');sessionStorage.removeItem('lisan_notify_log_owner');}catch(e){};fetch('/api/logout',{method:'POST'}).then(function(){location.href='/login'})">Log Out</button>
  </div>
</div>

<div id="modeSwitch" data-mode="text"></div>
<script src="/mode_switch.js"></script>

<div class="tv-wrap">
  <div class="card" id="introCard">
    <h3 id="introHeading"></h3>
    <p id="introText" class="note"></p>
    <ol id="introSteps" style="margin:10px 22px;line-height:1.7;font-size:14px;"></ol>
  </div>

  <div class="card hidden" id="offCard"><p id="offText"></p></div>

  <div class="card" id="newCard">
    <h3 id="newHeading"></h3>
    <div class="tv-grid2">
      <div><label for="tvTitle" id="titleLabel"></label><input type="text" id="tvTitle" maxlength="120" autocomplete="off"></div>
      <div><label for="tvLang" id="langLabel"></label><select id="tvLang"></select></div>
    </div>
    <label for="tvText" id="textLabel"></label>
    <div id="tvText" dir="auto"></div>
    <div class="tv-row" style="margin-top:6px;"><button type="button" class="btn-plain" id="btnFile"></button><select id="tvAddSound" class="tv-addsound"></select><input type="file" id="tvFile" accept=".txt,.docx,.srt,.vtt,text/plain" class="hidden"><span id="fileMsg" style="font-size:13px;color:var(--text-muted);"></span></div>
    <p class="note" id="soundTip" style="margin-top:6px;"></p>
    <label class="tv-consent hidden" id="keepTimesRow" style="margin-top:8px;"><input type="checkbox" id="tvKeepTimes" checked><span id="keepTimesLabel"></span></label>
    <p class="note hidden" id="timesChanged"></p>
    <div class="tv-count" id="tvCount"></div>
    <p class="note" id="scriptTip" style="margin-top:10px;white-space:pre-line;"></p>
    <div class="tv-row"><button id="btnNew" class="green"></button></div>
    <div id="newErr" class="tv-err hidden"></div>
  </div>

  <div class="card hidden" id="jobCard">
    <h3 id="jobHeading"></h3>
    <div id="jobTitle" style="font-weight:700;margin-bottom:6px;"></div>
    <div class="tv-row" style="margin-top:0;"><button class="btn-plain" id="btnClose"></button><button class="btn-plain" id="btnDelete"></button></div>
    <h4 id="spkHeading" style="margin-top:18px;"></h4>
    <p class="note" id="spkNote"></p>
    <div id="spkList"></div>
    <div class="tv-row"><button id="btnPrepare" class="green"></button></div>
    <p class="note hidden" id="prepareWarn"></p>
    <div id="busyBox" class="hidden"><div id="busyText" style="margin-top:10px;font-weight:600;"></div><div class="tv-bar"><div id="busyBar"></div></div></div>
    <div id="jobErr" class="tv-err hidden"></div>
  </div>

  <div class="card hidden" id="linesCard">
    <h3 id="linesHeading"></h3>
    <p class="note" id="linesNote"></p>
    <details id="pronBox" style="margin:8px 0 12px;"><summary><strong id="pronHeading"></strong></summary>
      <p class="note" id="pronNote" style="margin-top:6px;"></p>
      <textarea id="pronText" dir="auto" rows="4" maxlength="12000"></textarea>
      <div class="tv-row"><button type="button" class="btn-plain" id="btnPron"></button><span id="pronMsg" style="font-size:13px;color:var(--text-muted);"></span></div>
    </details>
    <div id="lineList"></div>
  </div>

  <div class="card hidden" id="audioCard">
    <h3 id="audioHeading"></h3>
    <p class="note" id="audioNote"></p>
    <div class="tv-row"><label for="tvSpeed" id="speedLabel"></label><select id="tvSpeed"></select><span class="note" id="speedNote"></span></div>
    <div class="tv-row" id="fitRow"><label for="tvFit" id="fitLabel"></label><input type="number" id="tvFit" min="3" max="7200" step="0.5" inputmode="decimal" style="width:110px;"><span id="fitUnit"></span><span class="note" id="fitNote"></span></div>
    <div id="timedRow" class="hidden"><label class="tv-consent" style="margin-top:12px;"><input type="checkbox" id="tvTimed"><span id="timedLabel"></span></label><p class="note" id="timedNote"></p></div>
    <p class="note hidden" id="fitMsg" style="font-weight:600;"></p>
    <div class="tv-row"><button id="btnSpeak" class="green"></button></div>
    <div id="speakErr" class="tv-err hidden"></div>
    <div id="audioBox" class="hidden">
      <audio id="finalAudio" controls preload="none"></audio>
      <div class="tv-row"><a id="dlLink" class="btn-logout" href="#" download></a><span id="audioLen" style="font-size:13px;color:var(--text-muted);"></span></div>
      <div class="tv-row" id="extraDl"><a id="dlSrt" class="btn-logout" href="#" download></a><a id="dlZip" class="btn-logout" href="#" download></a></div>
      <p class="note hidden" id="subsOld"></p>
    </div>
  </div>

  <div class="card" id="listCard">
    <h3 id="listHeading"></h3>
    <div id="listBody"></div>
  </div>
</div>

<script src="/dialogs.js"></script>
<script>
(function () {
  function apply(on) {
    try {
      document.body.classList.toggle("dark", !!on);
      localStorage.setItem("lisan_dark_mode", on ? "1" : "0");
      var db = document.getElementById("darkModeBtn");
      if (db) db.textContent = on ? "☀️" : "🌙";
    } catch (e) {}
  }
  window._toggleDarkMode = function () { apply(!document.body.classList.contains("dark")); };
  var saved;
  try { saved = localStorage.getItem("lisan_dark_mode"); } catch (e) { saved = null; }
  apply(saved === null || saved === "1");
})();

var LANG = "en";
try { LANG = (localStorage.getItem("lisan_lang") === "ar") ? "ar" : "en"; } catch (e) {}
window._toggleLang = function () {
  try { localStorage.setItem("lisan_lang", LANG === "ar" ? "en" : "ar"); } catch (e) {}
  location.reload();
};

function api(method, url, body) {
  var init = { method: method, headers: {} };
  if (body !== undefined && body !== null) {
    if (body instanceof FormData) init.body = body;
    else { init.headers["Content-Type"] = "application/json"; init.body = JSON.stringify(body); }
  }
  return fetch(url, init).then(function (r) {
    if (r.status === 401) { location.href = "/login"; return new Promise(function () {}); }
    return r.json().catch(function () { return {}; }).then(function (d) { return { ok: r.ok, status: r.status, data: d || {} }; });
  }, function () { return { ok: false, status: 0, data: { error: T.netErr } }; });
}

// ---------------------------------------------------------------- the formatted text boxes (1.97.1, Ali)
// A text box that formats itself while the person types or pastes: speaker names ("Sara:" at the start of a line) in that speaker's
// own color, and human sounds such as (LAUGH) or (YAWN) as an amber mark, also when they are typed by hand. The same list of sounds
// and the same name rule as the server (longdub_service.SOUNDS, text_voice.parse_script).
var SOUNDS = ["LAUGH", "CHUCKLE", "GIGGLE", "SIGH", "GASP", "CRY", "SOB", "SNIFFLE", "YAWN", "COUGH", "CLEAR THROAT", "SNEEZE", "BREATHE", "GULP"];
var SOUND_ALIASES = ["LAUGHS", "LAUGHING", "SIGHS", "CRIES", "CRYING", "YAWNS", "COUGHS", "GASPS", "SOBS", "BREATH", "THROAT"];
var SOUND_NAMES = {
  en: { LAUGH: "Laugh", CHUCKLE: "Chuckle", GIGGLE: "Giggle", SIGH: "Sigh", GASP: "Gasp", CRY: "Cry", SOB: "Sob", SNIFFLE: "Sniffle", YAWN: "Yawn",
        COUGH: "Cough", "CLEAR THROAT": "Clear throat", SNEEZE: "Sneeze", BREATHE: "Breathe", GULP: "Gulp" },
  ar: { LAUGH: "ضحك", CHUCKLE: "ضحكة خفيفة", GIGGLE: "قهقهة خافتة", SIGH: "تنهيدة", GASP: "شهقة", CRY: "بكاء", SOB: "نحيب", SNIFFLE: "شهيق الأنف",
        YAWN: "تثاؤب", COUGH: "سعال", "CLEAR THROAT": "تنحنح", SNEEZE: "عطسة", BREATHE: "نَفَس", GULP: "بلع الريق" }
};
function soundRe() {
  var all = SOUNDS.concat(SOUND_ALIASES).map(function (k) { return k.replace(/ /g, "[ _]+"); }).sort(function (a, b) { return b.length - a.length; });
  return new RegExp("\\(\\s*(?:" + all.join("|") + ")\\s*\\)", "gi");
}
function soundOptions() {
  var names = SOUND_NAMES[LANG] || SOUND_NAMES.en;
  return '<option value="">' + esc(T.addSound) + "</option>" + SOUNDS.map(function (k) {
    return '<option value="(' + k + ')">' + esc(names[k]) + " (" + k + ")</option>";
  }).join("");
}
function speakerClass(id) {
  var k = job ? job.speakers.map(function (s) { return s.id; }).indexOf(id) : -1;
  return k < 0 ? "" : "tv-name tv-n" + (k % 8);
}
var NAME_RE = /^(\s*)(\p{L}[^:\uFF1A\n]{0,39}?)(\s*[:\uFF1A])(?=\s+\S)/u;
function scriptNames(text) {
  // the server's rule: at least two lines, and at least half of them, start with "Name:" (four words at most)
  var filled = text.split("\n").filter(function (l) { return l.trim(); }), hits = [], order = [];
  filled.forEach(function (l) { var m = NAME_RE.exec(l); if (m && m[2].trim().split(/\s+/).length <= 4) hits.push(m[2].trim()); });
  hits.forEach(function (n) { if (order.indexOf(n) < 0) order.push(n); });

}

var previewAudio = null;

}

function toggleRecord() {
  if (own.rec && own.rec.state === "recording") { own.rec.stop(); return; }
  if (!navigator.mediaDevices || !window.MediaRecorder) { err($("ownErr"), T.micDenied); return; }
  navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
    own.stream = stream; own.chunks = [];
    var rec = new MediaRecorder(stream);
    own.rec = rec;
    rec.ondataavailable = function (e) { if (e.data && e.data.size) own.chunks.push(e.data); };
    rec.onstop = function () {
      try { stream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {}
      var secs = Math.round((Date.now() - own.started) / 1000);
      var type = rec.mimeType || "audio/webm";
      var ext = type.indexOf("mp4") >= 0 ? "m4a" : (type.indexOf("ogg") >= 0 ? "ogg" : "webm");
      $("ownRec").textContent = T.recAgain;
      if (secs < 5) { own.blob = null; err($("ownErr"), T.recShort); $("ownState").textContent = ""; return; }
      own.blob = new Blob(own.chunks, { type: type }); own.name = "recording." + ext; own.secs = secs;
      $("ownState").textContent = T.recReady(secs);
    };
    own.started = Date.now();
    rec.start();
    err($("ownErr"), "");
    $("ownRec").textContent = T.recStop;
    setTimeout(function () { if (rec.state === "recording") rec.stop(); }, 20000);
  }, function () { err($("ownErr"), T.micDenied); });
}

function makeOwn(sp) {
  if (!own.blob) { err($("ownErr"), T.needSample); return; }

  var fd = new FormData();
  fd.append("file", own.blob, own.name);
  fd.append("speaker", speakerName(sp) + " (" + (job.title || "").slice(0, 40) + ")");
  fd.append("for_text_voice", "true");
  fd.append("sample_language", $("ownLang").value);

  api("POST", "/api/upload_custom_voice", fd).then(function (r) {

  });
}

      (ln.gender_check ? '<span class="tv-badge">' + esc(T.check) + "</span>" : "") +
      "<span>" + esc(T.emotion) + '</span><select data-emo="' + esc(ln.id) + '"' + (job.busy ? " disabled" : "") + ">" + opts + "</select>" +
      '<button type="button" class="btn-plain" style="padding:3px 10px;" data-tash="' + esc(ln.id) + '" title="' + esc(T.tashkeelTip) + '"' + (job.busy ? " disabled" : "") + ">" + esc(T.tashkeel) + "</button>" +
      "<span>" + esc(T.lineSpeed) + '</span><select data-speed="' + esc(ln.id) + '"' + (job.busy ? " disabled" : "") + ">" + speedOptions(ln.speed, true) + "</select>" +
      (ln.silent && (ln.arabic || "").trim() ? '<span class="tv-badge">' + esc(T.silent) + "</span>" : "") +
      (ln.spoken ? '<button type="button" class="btn-plain" style="padding:3px 10px;" data-play="' + esc(ln.id) + '">' + T.playLine + "</button>" +
                   '<button type="button" class="btn-plain" style="padding:3px 10px;" data-again="' + esc(ln.id) + '" title="' + esc(T.againTip) + '"' + (job.busy ? " disabled" : "") + ">" + esc(T.again) + "</button>" : "") +
      '<span class="tv-saved" id="saved_' + esc(ln.id) + '"></span></div>' +
      (arabicSource ? "" : '<div class="tv-line-src" dir="auto">' + formatText(ln.text, false) + "</div>") +
      '<div dir="rtl" data-ar="' + esc(ln.id) + '"></div>' +
      '<div class="tv-row" style="margin-top:4px;"><select class="tv-addsound" data-sound="' + esc(ln.id) + '"' + (job.busy ? " disabled" : "") + ">" + soundOptions() + "</select></div>" +
      '<div class="tv-voice" dir="rtl" id="voice_' + esc(ln.id) + '">' + voiceCopy(ln) + "</div></div>";
  }).join("");
  Array.prototype.forEach.call($("lineList").querySelectorAll("[data-ar]"), function (t) {
    var ln = job.lines.filter(function (l) { return l.id === t.getAttribute("data-ar"); })[0];
    richBox(t, { oneLine: true });
    t.value = ln ? ln.arabic : "";
    t.disabled = !!job.busy;
    t.addEventListener("input", function () { queueSave(t.getAttribute("data-ar"), { arabic: t.value }); });
  });
  Array.prototype.forEach.call($("lineList").querySelectorAll("[data-sound]"), function (s) {
    s.onchange = function () {
      var box = document.querySelector('[data-ar="' + s.getAttribute("data-sound") + '"]');
      if (box && s.value) box.insertSound(s.value);
      s.value = "";
    };
  });
  Array.prototype.forEach.call($("lineList").querySelectorAll("[data-emo]"), function (s) {
    s.onchange = function () { queueSave(s.getAttribute("data-emo"), { emotion: s.value }, 0); };
  });
  Array.prototype.forEach.call($("lineList").querySelectorAll("[data-again]"), function (b) {
    b.onclick = function () {
      b.disabled = true;
      var id = b.getAttribute("data-again");
      flushSave(id).then(function () {
        return api("POST", "/api/text_voice/" + job.id + "/lines", { lines: [{ id: id, again: true }] });
      }).then(function (r) {
        if (!r.ok) { b.disabled = false; alertMsg(r.data.error || T.netErr); return; }
        job = r.data;
        renderLines(); renderAudio();
        try { $("btnSpeak").scrollIntoView({ behavior: "smooth", block: "center" }); } catch (e) {}
      });
    };
  });
  Array.prototype.forEach.call($("lineList").querySelectorAll("[data-speed]"), function (s) {
    s.onchange = function () { queueSave(s.getAttribute("data-speed"), { speed: s.value ? Number(s.value) : null }, 0); };
  });
  if (document.activeElement !== $("pronText")) $("pronText").value = job.pronunciation || "";
  if (job.pronunciation_count) $("pronBox").open = true;
  Array.prototype.forEach.call($("lineList").querySelectorAll("[data-play]"), function (b) {
    b.onclick = function () { playPreview("/api/text_voice/" + job.id + "/line/" + encodeURIComponent(b.getAttribute("data-play")) + "?t=" + Date.now()); };
  });
  Array.prototype.forEach.call($("lineList").querySelectorAll("[data-tash]"), function (b) {
    b.onclick = function () { tashkeelLine(b.getAttribute("data-tash"), b); };
  });
}

// What the voice really reads, when it differs from the line (the stop form before a comma or a full stop, the pronunciation list):
// the changed words are highlighted, so the person sees what they will hear.
function voiceCopy(ln) {
  if (!ln) return "";
  var box = (ln.stop_form || ln.as_written) ? '<label class="tv-exact" dir="auto" title="' + esc(T.asWrittenTip) + '"><input type="checkbox" data-exact="' + esc(ln.id) + '"' +
    (ln.as_written ? " checked" : "") + (job.busy ? " disabled" : "") + "> " + esc(T.asWritten) + "</label>" : "";
  return voiceWords(ln) + box;
}
function voiceWords(ln) {
  if (!ln || !ln.voice_text) return "";
  var mine = (ln.arabic || "").trim().split(/\s+/), said = ln.voice_text.split(/\s+/);
  var words = said.map(function (w, k) { return mine.length === said.length && mine[k] === w ? esc(w) : "<mark>" + esc(w) + "</mark>"; });
  if (mine.length !== said.length) words = [esc(ln.voice_text)];          // the list changed the number of words: the whole copy, plain
  return '<div><span dir="auto">' + esc(T.voiceReads) + "</span> " + words.join(" ") + "</div>";
}

function speedOptions(value, perLine) {
  var out = perLine ? '<option value=""' + (value ? "" : " selected") + ">" + esc(T.lineSpeedSame) + "</option>" : "";
  (job.speeds || [0.85, 0.9, 1, 1.1, 1.2]).forEach(function (v) {
    out += '<option value="' + v + '"' + (Number(value) === Number(v) ? " selected" : "") + ">" + esc(T.speedNames[String(v)] || v) + " (" + v + "×)</option>";
  });
  return out;
}

$("lineList").addEventListener("change", function (e) {
  var t = e.target;
  if (!t || !t.getAttribute || !t.getAttribute("data-exact")) return;
  queueSave(t.getAttribute("data-exact"), { as_written: !!t.checked }, 0);
});

$("btnPron").onclick = function () {
  if (!job) return;
  $("btnPron").disabled = true;
  flushAll().then(function () {
    return api("POST", "/api/text_voice/" + job.id + "/options", { pronunciation: $("pronText").value });
  }).then(function (r) {
    $("btnPron").disabled = false;
    if (!r.ok) { $("pronMsg").textContent = r.data.error || T.netErr; return; }
    job = r.data;
    $("pronText").value = job.pronunciation || "";
    $("pronMsg").textContent = T.pronSaved(job.pronunciation_count, job.pronunciation_bad || 0);
    refreshVoiceCopies();
    renderAudio();
  });
};

function saveOptions(change, el) {
  if (!job) return;
  if (el) el.disabled = true;
  flushAll().then(function () {
    return api("POST", "/api/text_voice/" + job.id + "/options", change);
  }).then(function (r) {
    if (el) el.disabled = false;
    if (!r.ok) { alertMsg(r.data.error || T.netErr); renderAudio(); return; }
    job = r.data;
    renderAudio();
  });
}
$("tvFit").onchange = function () {
  var v = $("tvFit").value.trim();
  saveOptions({ fit_seconds: v ? Number(v) : null }, $("tvFit"));
};
$("tvTimed").onchange = function () { saveOptions({ keep_times: $("tvTimed").checked }, $("tvTimed")); };

$("tvSpeed").onchange = function () {
  if (!job) return;
  $("tvSpeed").disabled = true;
  flushAll().then(function () {
    return api("POST", "/api/text_voice/" + job.id + "/options", { speed: Number($("tvSpeed").value) });
  }).then(function (r) {
    $("tvSpeed").disabled = false;
    if (!r.ok) { alertMsg(r.data.error || T.netErr); return; }
    job = r.data;
    renderAudio();
  });
};

function tashkeelLine(lineId, btn) {
  var box = document.querySelector('[data-ar="' + lineId + '"]');
  var before = box ? box.value.trim() : "";
  btn.disabled = true; btn.textContent = T.tashkeelBusy;
  flushSave(lineId).then(function () {
    return api("POST", "/api/text_voice/" + job.id + "/line/" + encodeURIComponent(lineId) + "/tashkeel");
  }).then(function (r) {
    btn.disabled = false; btn.textContent = T.tashkeel;
    if (!r.ok) { alertMsg(r.data.error || T.netErr); return; }
    job = r.data;
    var ln = job.lines.filter(function (l) { return l.id === lineId; })[0];
    if (!ln) return;
    if (ln.arabic.trim() === before) { alertMsg(T.tashkeelNone); return; }
    if (box) box.value = ln.arabic;
    refreshVoiceCopies();
    var s = $("saved_" + lineId);
    if (s) { s.textContent = T.saved; setTimeout(function () { if (s) s.textContent = ""; }, 1500); }
    renderAudio();
  });
}

var pending = {};
function queueSave(lineId, change, delay) {
  pending[lineId] = Object.assign(pending[lineId] || {}, change);
  clearTimeout(saveTimers[lineId]);
  saveTimers[lineId] = setTimeout(function () { flushSave(lineId); }, delay === undefined ? 900 : delay);
}
function flushSave(lineId) {
  var change = pending[lineId];
  if (!change) return Promise.resolve();
  delete pending[lineId];
  return api("POST", "/api/text_voice/" + job.id + "/lines", { lines: [Object.assign({ id: lineId }, change)] }).then(function (r) {
    if (!r.ok) { alertMsg(r.data.error || T.netErr); return; }
    job = r.data;
    var s = $("saved_" + lineId);
    if (s) { s.textContent = T.saved; setTimeout(function () { if (s) s.textContent = ""; }, 1500); }
    refreshVoiceCopies();
    renderAudio();
  });
}
function refreshVoiceCopies() {
  (job.lines || []).forEach(function (l) { var v = $("voice_" + l.id); if (v) v.innerHTML = voiceCopy(l); });
}
function flushAll() { return Promise.all(Object.keys(pending).map(flushSave)); }

// ---------------------------------------------------------------- the audio
function renderAudio() {
  var b = $("btnSpeak");
  b.disabled = !!job.busy;
  b.textContent = job.speak_price ? T.speak(job.speak_price, job.lines_to_speak) : (job.audio_outdated ? T.speakAgainFree : T.speakFree);
  $("tvSpeed").innerHTML = speedOptions(job.speed || 1, false);
  $("tvSpeed").disabled = !!job.busy;
  show($("timedRow"), !!job.times_available);
  $("tvTimed").checked = !!job.keep_times; $("tvTimed").disabled = !!job.busy;
  show($("fitRow"), !job.keep_times);
  if (document.activeElement !== $("tvFit")) $("tvFit").value = job.fit_seconds ? String(job.fit_seconds) : "";
  $("tvFit").disabled = !!job.busy;
  var fm = "", f = job.fit;
  if (f && f.timed) fm = f.late_count ? T.timedLate(f.late_count, Math.max.apply(null, f.late.map(function (x) { return x.late; }))) : T.timedOk;
  else if (f && f.over) fm = T.fitOver(f.over, f.cut_chars || 0);
  else if (f && f.under) fm = T.fitUnder(f.under);
  else if (f && f.target) fm = T.fitDone(f.seconds, f.pauses, f.speed);
  $("fitMsg").textContent = fm; show($("fitMsg"), !!fm);
  err($("speakErr"), !job.busy && job.prepared && job.error ? job.error : "");
  var expired = !job.audio_file && (job.notes || []).indexOf("audio_expired") >= 0;
  $("audioNote").textContent = expired ? T.audioNote + " " + T.audioExpired : T.audioNote;
  show($("audioBox"), job.audio_file);
  if (job.audio_outdated) $("audioNote").textContent = T.audioNote + " " + T.audioOld;
  if (job.audio_file) {
    var url = "/api/text_voice/" + job.id + "/audio?v=" + encodeURIComponent(String(job.updated || ""));
    if ($("finalAudio").getAttribute("data-src") !== url) { $("finalAudio").src = url; $("finalAudio").setAttribute("data-src", url); }
    $("dlLink").href = url;
    $("audioLen").textContent = job.audio_seconds ? T.length(job.audio_seconds) : "";
  }
  show($("extraDl"), !!job.subtitles_ready);
  show($("subsOld"), !!job.audio_file && !job.audio_outdated && !job.subtitles_ready);
  if (job.subtitles_ready) {
    $("dlSrt").href = "/api/text_voice/" + job.id + "/subtitles";
    $("dlZip").href = "/api/text_voice/" + job.id + "/lines.zip";
  }
}

$("btnSpeak").onclick = function () {
  if (!job) return;
  var used = {};
  job.lines.forEach(function (l) { if ((l.arabic || "").trim() && !l.silent) used[l.speaker_id] = 1; });
  var missing = job.speakers.filter(function (s) { return used[s.id] && !s.voice_id; });
  if (missing.length) { err($("speakErr"), T.needVoice(speakerName(missing[0]))); return; }
  $("btnSpeak").disabled = true;
  flushAll().then(function () {
    api("POST", "/api/text_voice/" + job.id + "/speak").then(function (r) {
      if (!r.ok) { $("btnSpeak").disabled = false; err($("speakErr"), r.data.error || T.netErr); return; }
      showJob(r.data);
    });
  });
};

function startPoll() {
  if (pollTimer) return;
  pollTimer = setInterval(function () {
    if (!job) return stopPoll();
    api("GET", "/api/text_voice/" + job.id).then(function (r) {
      if (!r.ok || !job || r.data.id !== job.id) return;
      var was = job.busy;
      if (r.data.busy) {
        job = r.data;
        show($("busyBox"), true);
        $("busyBar").style.width = Math.max(3, r.data.percent || 0) + "%";
      } else {
        stopPoll();
        showJob(r.data);
        if (was) {
          api("GET", "/api/text_voice/config").then(function (c) { if (c.ok) setCredits(c.data.credits); });
          loadList();
        }
      }
    });
  }, 2500);
}
function stopPoll() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }

// ---------------------------------------------------------------- start
applyStaticText();
api("GET", "/api/text_voice/config").then(function (r) {
  cfg = r.ok ? r.data : { enabled: true, languages: [{ code: "en", name: "English", native: "English", arabic: "الإنجليزية" }], max_chars: 20000, clone_credits: 5, can_clone: false };
  setCredits(cfg.credits);
  if (!cfg.enabled) { show($("offCard"), true); show($("newCard"), false); return; }
  $("tvLang").innerHTML = cfg.languages.map(function (l) { return '<option value="' + esc(l.code) + '">' + esc(langName(l)) + "</option>"; }).join("");
  updateCount();
  var last = null;
  try { last = localStorage.getItem("lisan_text_voice_open"); } catch (e) {}
  try { var asked = new URLSearchParams(location.search).get("open"); if (asked && /^[0-9a-f]{32}$/.test(asked)) last = asked; } catch (e) {}   // "Open project" on the Account page
  if (last) openJob(last);
  loadList();
});
</script>
</body>
</html>
