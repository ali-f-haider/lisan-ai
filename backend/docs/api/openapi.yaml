    "/v1/jobs": {
      "post": {
        "operationId": "createJob",
        "summary": "Create a short or long upload without charging credits",
        "description": "The source language is English and the target is Arabic. No lip-sync in this release. Validate current owner terms, per-file rights, plan, storage and effective file limits before allocation. stated_speakers is a hint.",
        "x-required-scope": "dub",
        "parameters": [
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "description": "Persist a unique key per logical request. Retry identical content with that key. Completed response TTL is 24 hours; in-flight operations never expire into a second execution.",
            "schema": {
              "type": "string",
              "pattern": "^[A-Za-z0-9_-]{16,128}$",
              "minLength": 16,
              "maxLength": 128
            }
          }
        ],
        "responses": {
          "201": {
            "description": "Success",
            "headers": {
              "X-Request-ID": {
                "schema": {
                  "type": "string"
                }
              },
              "Retry-After": {
