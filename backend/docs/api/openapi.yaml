{
  "openapi": "3.1.0",
  "info": {
    "title": "Lisan AI API",
    "version": "1.0.0-draft",
    "description": "PROPOSED CONTRACT: requires server integration; these routes are not yet deployed. English-to-Arabic dubbing using the website workflow, account and prices. Polling only. Bearer keys are server-side secrets. Every mutation requires Idempotency-Key; every paid step requires explicit quote acceptance. No credentials in URLs. Validation/HTTP failures use Error, never an HTML login redirect."
  },
  "servers": [
    {
      "url": "https://lisanai.org",
      "description": "Intended production origin after integration"
    }
  ],
