<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lisan AI — Login</title>
<link rel="icon" href="/logo.png">
<link rel="stylesheet" href="/styles.css">
<style>
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background: #f0f2f5; }
    .login-card { background: #fff; padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
    .login-card img { height: 60px; margin-bottom: 16px; }
    .login-card h1 { font-size: 28px; margin-bottom: 8px; color: #1a237e; }
    .login-card p { color: #6b7280; margin-bottom: 24px; }
    .login-card input { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #e5e7eb; border-radius: 8px; font-size: 14px; box-sizing: border-box; }
    .login-card input:focus { outline: none; border-color: #42a5f5; }
    .login-card button { width: 100%; padding: 12px; margin-bottom: 8px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .btn-primary { background: #1a237e; color: #fff; display: flex; align-items: center; justify-content: center;}
    .btn-primary:hover { background: #3949ab; }
    .btn-secondary { background: #f3f4f6; color: #1a237e; border: 1px solid #e5e7eb;  display: flex; align-items: center; justify-content: center;}
    .btn-secondary:hover { background: #e5e7eb; }
    .msg { margin-top: 12px; font-size: 13px; min-height: 20px; }
    .msg.err { color: #dc2626; }
    .msg.ok { color: #059669; }
    .help-link { margin-top: 24px; font-size: 13px; color: #6b7280; }
    .help-link a { color: #42a5f5; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
    <div class="login-card">
        <img src="/logo.png" alt="Lisan AI">
        <h1>Welcome Back</h1>
        <p>Log in to continue your dubbing projects.</p>
        
        <input type="email" id="loginEmail" placeholder="Email address" autocomplete="email">
        <input type="password" id="loginPassword" placeholder="Password (or access code)" autocomplete="current-password" onkeydown="if(event.key==='Enter')doSmartLogin()">
        <div style="display:flex;flex-direction:column;gap:10px;margin:14px 0;">
  <button type="button" onclick="socialLogin('google')"
    style="display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:11px;border-radius:10px;border:1px solid #dadce0;background:#fff;font-weight:600;cursor:pointer;font-family:inherit;">

    <span>Continue with Google</span>
  </button>
  <button type="button" onclick="socialLogin('facebook')"
    style="display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:11px;border-radius:10px;border:1px solid #dadce0;background:#fff;font-weight:600;cursor:pointer;font-family:inherit;">
    <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#1877F2" d="M24 12.07C24 5.4 18.63 0 12 0S0 5.4 0 12.07C0 18.1 4.39 23.09 10.13 24v-8.44H7.08v-3.49h3.05V9.41c0-3.02 1.79-4.7 4.53-4.7 1.31 0 2.68.24 2.68.24v2.97h-1.51c-1.49 0-1.95.93-1.95 1.89v2.26h3.32l-.53 3.49h-2.79V24C19.61 23.09 24 18.1 24 12.07z"/></svg>
    <span>Continue with Facebook</span>
  </button>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
function socialLogin(provider){
  var sb = supabase.createClient(window.__SUPABASE_URL, window.__SUPABASE_KEY);
  sb.auth.signInWithOAuth({ provider: provider, options: { redirectTo: location.origin + "/login" } });
}
(function(){
  var m = location.hash.match(/access_token=([^&]+)/);
  if (!m) return;
  fetch("/api/login", { method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ access_token: decodeURIComponent(m[1]) }) })
    .then(function(r){ return r.json(); })
    .then(function(d){ if (!d.error) location.replace("/app"); })
    .catch(function(){});
})();
</script>
        <button class="btn-primary" id="btnLogin" onclick="doSmartLogin()">Log In</button>
        <button class="btn-secondary" onclick="doSignUp()">Create Account</button>
        
        <div id="loginMsg" class="msg"></div>
        
        <div class="help-link">
            <a href="/help">❓ Help & FAQ / المساعدة والأسئلة الشائعة</a>
        </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var SUPABASE_URL = window.__SUPABASE_URL || "";
var SUPABASE_KEY = window.__SUPABASE_KEY || "";
var sb = null;

if (SUPABASE_URL && SUPABASE_KEY) {
    try { sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } catch(e) { console.error(e); }
}

function showMsg(text, isErr) {
    var el = document.getElementById("loginMsg");
    el.textContent = text;
    el.className = "msg " + (isErr ? "err" : "ok");
}

function hideMsg() { document.getElementById("loginMsg").textContent = ""; }

async function sendSession(session) {
    if (!session || !session.access_token) return;
    try {
        await fetch("/api/auth/session", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                access_token: session.access_token,
                refresh_token: session.refresh_token || ""
            })
        });
        window.location.href = "/app";
    } catch (e) {
        showMsg("Session error: " + e.message, true);
    }
}

async function doSmartLogin() {
    hideMsg();
    var email = document.getElementById("loginEmail").value.trim();
    var password = document.getElementById("loginPassword").value;
    if (!password) { showMsg("Please enter a password or access code.", true); return; }

    if (!email) {
        doLegacyLogin(password);
        return;
    }

    if (!sb) { showMsg("Login system unavailable.", true); return; }

    document.getElementById("btnLogin").disabled = true;
    try {
        var res = await sb.auth.signInWithPassword({ email: email, password: password });
        document.getElementById("btnLogin").disabled = false;
        if (res.error) {
            doLegacyLogin(password);
            return;
        }
        await sendSession(res.data.session);
    } catch (e) {
        document.getElementById("btnLogin").disabled = false;
        doLegacyLogin(password);
    }
}

async function doLegacyLogin(pw) {
    try {
        var res = await fetch("/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ password: pw || document.getElementById("loginPassword").value })
        });
        var data = await res.json();
        if (data.ok) {
            window.location.href = "/app";
        } else {
            showMsg("Invalid email, password, or access code.", true);
        }
    } catch (e) {
        showMsg("Login failed: " + e.message, true);
    }
}

async function doSignUp() {
    hideMsg();
    var email = document.getElementById("loginEmail").value.trim();
    var password = document.getElementById("loginPassword").value;
    if (!email || !password) { showMsg("Enter email and password to sign up.", true); return; }
    if (!sb) { showMsg("Sign up unavailable.", true); return; }
    
    try {
        var res = await sb.auth.signUp({ email: email, password: password });
        if (res.error) { showMsg(res.error.message, true); return; }
        if (res.data.session) {
            await sendSession(res.data.session);
        } else {
            showMsg("Account created! Check your email to confirm, then log in.", false);
        }
    } catch (e) {
        showMsg("Sign up failed: " + e.message, true);
    }
}
</script>
</body>
</html>
