<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Lisan AI — Login</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f5f5f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .login-card { background: #fff; border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,0.12); padding: 40px 36px; width: 380px; text-align: center; }
    .login-card h1 { font-size: 28px; color: #1a237e; margin-bottom: 4px; }
    .login-card .sub { font-size: 14px; color: #666; margin-bottom: 6px; }
    .login-card .sub-ar { font-size: 14px; color: #666; margin-bottom: 24px; direction: rtl; }
    .login-card input { width: 100%; padding: 12px 14px; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; margin-bottom: 16px; outline: none; transition: border 0.2s; }
    .login-card input:focus { border-color: #42a5f5; }
    .login-card button { width: 100%; padding: 12px; background: #1a237e; color: #fff; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; transition: background 0.2s; }
    .login-card button:hover { background: #283593; }
    .error { color: #c62828; font-size: 13px; margin-bottom: 12px; display: none; }
</style>
</head>
<body>
<div class="login-card">
    <h1>Lisan AI</h1>
    <p class="sub"><strong>English to Arabic AI Dubbing</strong></p>
    <p class="sub-ar"><strong>دبلجة آلية من الإنجليزية إلى العربية</strong></p>
    <div class="error" id="loginError">Incorrect password. Please try again.</div>
    <input type="password" id="loginPass" placeholder="Enter password" autofocus
           onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()">Log In</button>
    <p style="margin-top:16px;"><a href="/help" style="color:#42a5f5;font-size:13px;text-decoration:none;">❓ Help & FAQ / المساعدة والأسئلة الشائعة</a></p>
</div>
<script>
async function doLogin() {
    const pw = document.getElementById("loginPass").value;
    const err = document.getElementById("loginError");
    err.style.display = "none";
    try {
        const res = await fetch("/api/login", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({password: pw})
        });
        const data = await res.json();
        if (data.ok) {
            window.location.href = "/";
        } else {
            err.style.display = "block";
            document.getElementById("loginPass").value = "";
            document.getElementById("loginPass").focus();
        }
    } catch(e) {
        err.textContent = "Connection error. Please try again.";
        err.style.display = "block";
    }
}
</script>
</body>
</html>
