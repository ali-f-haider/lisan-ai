<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Lisan AI — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', -apple-system, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .login-card { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.1); padding: 40px 36px; width: 400px; text-align: center; }
    .login-card h1 { font-size: 28px; color: #1a237e; margin-bottom: 4px; }
    .login-card .sub { font-size: 14px; color: #666; margin-bottom: 4px; }
    .login-card .sub-ar { font-size: 14px; color: #666; margin-bottom: 24px; direction: rtl; }
    .tabs { display: flex; margin-bottom: 24px; border-bottom: 2px solid #e5e7eb; }
    .tab { flex: 1; padding: 10px; font-size: 15px; font-weight: 600; color: #9ca3af; background: none; border: none;
           cursor: pointer; font-family: inherit; transition: all 0.2s; border-bottom: 2px solid transparent; margin-bottom: -2px; }
    .tab.active { color: #1a237e; border-bottom-color: #1a237e; }
    .tab:hover:not(.active) { color: #6b7280; }
    .login-card input[type="email"], .login-card input[type="password"], .login-card input[type="text"] {
        width: 100%; padding: 12px 14px; border: 2px solid #e5e7eb; border-radius: 10px;
        font-size: 15px; margin-bottom: 12px; outline: none; transition: border 0.2s; font-family: inherit;
    }
    .login-card input:focus { border-color: #42a5f5; }
    .btn-primary {
        width: 100%; padding: 12px; background: #1a237e; color: #fff; border: none;
        border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.2s; font-family: inherit;
        margin-bottom: 8px;
    }
    .btn-primary:hover { background: #283593; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .error { color: #dc2626; font-size: 13px; margin-bottom: 12px; display: none; background: #fef2f2; padding: 8px 12px; border-radius: 8px; }
    .success { color: #059669; font-size: 13px; margin-bottom: 12px; display: none; background: #ecfdf5; padding: 8px 12px; border-radius: 8px; }
    .hidden { display: none !important; }
    .help-link { margin-top: 16px; }
    .help-link a { color: #42a5f5; font-size: 13px; text-decoration: none; }
    .access-toggle { font-size: 12px; color: #9ca3af; cursor: pointer; margin-top: 12px; display: inline-block; }
    .access-toggle:hover { color: #6b7280; text-decoration: underline; }
    .access-section { margin-top: 12px; padding-top: 12px; border-top: 1px solid #f1f5f9; }
</style>
</head>
<body>
<div class="login-card">
    <h1>Lisan AI</h1>
    <p class="sub"><strong>English to Arabic AI Dubbing</strong></p>
    <p class="sub-ar"><strong>دبلجة آلية من الإنجليزية إلى العربية</strong></p>

    <div class="error" id="authError"></div>
    <div class="success" id="authSuccess"></div>

    <!-- Tabs -->
    <div class="tabs">
        <button class="tab active" id="tabLogin" onclick="showLogin()">Log In</button>
        <button class="tab" id="tabSignup" onclick="showSignup()">Sign Up</button>
    </div>

    <!-- Login Form -->
    <div id="loginForm">
        <input type="email" id="loginEmail" placeholder="Email address" autocomplete="email">
		<input type="password" id="loginPassword" placeholder="Password or access code" autocomplete="current-password"
               onkeydown="if(event.key==='Enter')doSmartLogin()">
        <button class="btn-primary" id="btnLogin" onclick="doSmartLogin()">Log In</button>
    </div>

    <!-- Sign Up Form -->
    <div id="signupForm" class="hidden">
        <input type="email" id="signupEmail" placeholder="Email address" autocomplete="email">
        <input type="password" id="signupPassword" placeholder="Password (min 6 characters)" autocomplete="new-password"
               onkeydown="if(event.key==='Enter')doSignup()">
        <button class="btn-primary" id="btnSignup" onclick="doSignup()">Sign Up</button>
    </div>


    <div class="help-link">
        <a href="/help">❓ Help & FAQ / المساعدة والأسئلة الشائعة</a>
    </div>
</div>

<script>
// ===== ALL FUNCTIONS =====

function showErr(msg) {
    var el = document.getElementById("authError");
    el.textContent = msg; el.style.display = "block";
    document.getElementById("authSuccess").style.display = "none";
}
function showOk(msg) {
    var el = document.getElementById("authSuccess");
    el.textContent = msg; el.style.display = "block";
    document.getElementById("authError").style.display = "none";
}
function hideMsgs() {
    document.getElementById("authError").style.display = "none";
    document.getElementById("authSuccess").style.display = "none";
}
function showLogin() {
    hideMsgs();
    document.getElementById("loginForm").classList.remove("hidden");
    document.getElementById("signupForm").classList.add("hidden");
    document.getElementById("tabLogin").classList.add("active");
    document.getElementById("tabSignup").classList.remove("active");
}
function showSignup() {
    hideMsgs();
    document.getElementById("signupForm").classList.remove("hidden");
    document.getElementById("loginForm").classList.add("hidden");
    document.getElementById("tabSignup").classList.add("active");
    document.getElementById("tabLogin").classList.remove("active");
}
function toggleAccess() {
    document.getElementById("accessSection").classList.toggle("hidden");
}

var _supabase = null;

function _getSupabase() {
    if (_supabase) return _supabase;
    var url = window.__SUPABASE_URL || "";
    var key = window.__SUPABASE_KEY || "";
    if (!url || !key) return null;
    if (typeof window.supabase === "undefined" || typeof window.supabase.createClient !== "function") return null;
    try {
        _supabase = window.supabase.createClient(url, key);
        return _supabase;
    } catch(e) { console.error("Supabase init error:", e); return null; }
}

function doSignup() {
    hideMsgs();
    var sb = _getSupabase();
    if (!sb) { showErr("Authentication service is still loading. Please wait a moment and try again."); return; }
    var email = document.getElementById("signupEmail").value.trim();
    var password = document.getElementById("signupPassword").value;
    if (!email || !password) { showErr("Please enter email and password."); return; }
    if (password.length < 6) { showErr("Password must be at least 6 characters."); return; }
    document.getElementById("btnSignup").disabled = true;
    sb.auth.signUp({ email: email, password: password }).then(function(result) {
        document.getElementById("btnSignup").disabled = false;
        if (result.error) { showErr(result.error.message); return; }
        if (result.data && result.data.session) {
            _sendSession(result.data.session).then(function() {
                window.location.href = "/app";
            });
        } else {
            showOk("✅ Account created! Check your email for a confirmation link, then come back here and log in.");
            setTimeout(showLogin, 2000);
        }
    }).catch(function(e) { document.getElementById("btnSignup").disabled = false; showErr(e.message); });
}

function doLogin() {
    hideMsgs();
    var sb = _getSupabase();
    if (!sb) { showErr("Authentication service is still loading. Please wait a moment and try again."); return; }
    var email = document.getElementById("loginEmail").value.trim();
    var password = document.getElementById("loginPassword").value;
    if (!email || !password) { showErr("Please enter email and password."); return; }
    document.getElementById("btnLogin").disabled = true;
    sb.auth.signInWithPassword({ email: email, password: password }).then(function(result) {
        document.getElementById("btnLogin").disabled = false;
        if (result.error) { showErr(result.error.message); return; }
        _sendSession(result.data.session).then(function() {
            window.location.href = "/app";
        });
    }).catch(function(e) { document.getElementById("btnLogin").disabled = false; showErr(e.message); });
}

function doSmartLogin() {
    hideMsgs();
    var password = document.getElementById("loginPassword").value;
    if (!password) { showErr("Please enter password or access code."); return; }
    
    // Try Supabase login first
    var sb = _getSupabase();
    if (sb) {
        var email = document.getElementById("loginEmail").value.trim();
        if (email) {
            document.getElementById("btnLogin").disabled = true;
            sb.auth.signInWithPassword({ email: email, password: password }).then(function(result) {
                document.getElementById("btnLogin").disabled = false;
                if (result.error) { 
                    // If Supabase fails, try legacy access code
                    doLegacyLogin();
                    return; 
                }
                _sendSession(result.data.session).then(function() {
                    window.location.href = "/app";
                });
            }).catch(function(e) { 
                document.getElementById("btnLogin").disabled = false;
                doLegacyLogin();
            });
            return;
        }
    }
    
    // Fallback to legacy access code
    doLegacyLogin();
}


function _sendSession(session) {
    return fetch("/api/auth/session", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ access_token: session.access_token, refresh_token: session.refresh_token })
    }).catch(function(e) { console.error("Session send error:", e); });
}

function doLegacyLogin() {
    hideMsgs();
    var pw = document.getElementById("legacyPassword").value;
    if (!pw) { showErr("Please enter the access code."); return; }
    fetch("/api/login", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({password: pw})
    }).then(function(res) { return res.json(); }).then(function(data) {
        if (data.ok) { window.location.href = "/app"; }
        else { showErr("Invalid access code."); }
    }).catch(function(e) { showErr(e.message); });
}

// Auto-detect: if coming from email confirmation, show login tab with success message
if (window.location.hash.indexOf("type=signup") > -1 || window.location.hash.indexOf("type=email") > -1) {
    showLogin();
    showOk("✅ Email confirmed! You can now log in.");
}

// Check if already logged in
fetch("/api/auth/check").then(function(res) {
    if (res.ok) window.location.href = "/app";
}).catch(function() {});
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
</body>
</html>
