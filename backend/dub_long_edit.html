<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lisan AI — Correct a long dub</title>
<style>
:root{color-scheme:dark;--bg:#0b0c10;--card:#191b23;--border:#34384a;--text:#eceef8;--muted:#aab1c7;--accent:#a5b4fc}*{box-sizing:border-box}body{margin:0;font:15px/1.6 system-ui;background:var(--bg);color:var(--text)}header{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--border);gap:16px;flex-wrap:wrap}main{max-width:1150px;margin:24px auto;padding:0 16px}a{color:var(--accent)}h1{font-size:22px;margin:0}h2{font-size:18px}button,select,input,textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 12px}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent)}select{max-width:100%}.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:18px}.note{color:var(--muted);font-size:13px}.pages{display:flex;flex-wrap:wrap;gap:8px;position:sticky;top:0;z-index:2;background:var(--card);padding:10px 0}.pages .checked{border-color:#4ade80;color:#4ade80}.pages [aria-current=page]{background:#343b62}.line{display:grid;grid-template-columns:180px 1fr 1fr;gap:14px;padding:18px 0;border-bottom:1px solid var(--border)}textarea{display:block;width:100%;min-height:110px;resize:vertical}input[type=number]{width:100%;margin:5px 0}.line .warning{color:#fbbf24;font-size:13px}.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:16px 0}.primary{background:#4f46e5;border-color:#818cf8}.good{color:#4ade80}.error{color:#fca5a5;white-space:pre-wrap}.hidden{display:none}audio,video{width:100%;max-height:280px;margin:8px 0}label{display:block}.help{display:inline-block;position:relative}.help button{border-radius:50%;padding:0;width:24px;height:24px}.help span{display:none;position:absolute;z-index:8;width:min(440px,70vw);background:var(--card);padding:16px;border:1px solid var(--accent);border-radius:8px;inset-inline-start:0}.help:hover span,.help:focus-within span,.help.open span{display:block}@media(max-width:700px){.line{grid-template-columns:1fr}.card{padding:14px}header{padding:12px}}
</style></head><body><header><h1 id="title"></h1><nav><a href="/dub-long" id="back"></a> · <a href="/app" id="appLink"></a> <button id="language">العربية</button></nav></header>
<main><section class="card"><h2 id="chooseLabel"></h2><select id="projects"><option>Loading…</option></select>
<span class="help"><button type="button" aria-label="Help" id="helpButton">?</button><span id="intro"></span></span>
<p id="balance" class="note"></p></section>
<section class="card hidden" id="recovery"><h2 id="recoveryTitle"></h2><p id="recoveryText" class="note"></p><input type="file" id="original"><button id="restore"></button><p id="restoreStatus" role="status"></p></section>
<section class="card hidden" id="editor"><div class="actions"><button id="review"></button><span id="saveState" class="note"></span><span id="selectedCount"></span></div><nav class="pages" id="pages" aria-label="Transcript pages"></nav><div id="lines"></div>
<div class="actions"><button class="primary" id="dub"></button><button id="finish"></button></div><p class="note" id="trackHelp"></p><p class="error" id="error" role="alert"></p><p id="progress" role="status"></p></section>
<section class="card hidden" id="exports"><h2 id="exportsTitle"></h2><div id="history"></div></section></main>
<script src="/dialogs.js"></script><script src="/dub_long_edit.js"></script></body></html>
