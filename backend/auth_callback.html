<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Logging in...</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>body{font-family:Inter,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;background:#f0f2f5;}
.card{background:#fff;padding:40px;border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,0.1);text-align:center;}
</style></head>
<body>
<div class="card">
    <h2 style="color:#1a237e;">Completing login...</h2>
    <p style="color:#6b7280;margin-top:8px;">Please wait a moment.</p>
    <div id="err" style="color:#dc2626;margin-top:12px;display:none;"></div>
</div>
<script>
function _done() {
    var hash = window.location.hash.substring(1);
    var params = new URLSearchParams(hash);
    var accessToken = params.get("access_token");
    var refreshToken = params.get("refresh_token");
    if (accessToken) {
        fetch("/api/auth/session", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ access_token: accessToken, refresh_token: refreshToken })
        }).then(function() { window.location.href = "/app"; })
          .catch(function() { window.location.href = "/app"; });
        return;
    }
    // Try supabase session
    if (typeof window.supabase !== "undefined" && window.__SUPABASE_URL && window.__SUPABASE_KEY) {
        var sb = window.supabase.createClient(window.__SUPABASE_URL, window.__SUPABASE_KEY);
        sb.auth.getSession().then(function(result) {
            if (result.data && result.data.session) {
                fetch("/api/auth/session", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({ access_token: result.data.session.access_token, refresh_token: result.data.session.refresh_token })
                }).then(function() { window.location.href = "/app"; });
            } else {
                document.getElementById("err").textContent = "Login failed. Please try again.";
                document.getElementById("err").style.display = "block";
            }
        });
    } else {
        document.getElementById("err").textContent = "Login failed. Please try again.";
        document.getElementById("err").style.display = "block";
    }
}
// Wait for supabase to load
if (document.readyState === "complete") { setTimeout(_done, 500); }
else { window.addEventListener("load", function() { setTimeout(_done, 500); }); }
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
</body>
</html>
